<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRACE Matrix Shop-Floor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Gemini Inspired Dark Theme + Strict Rules */
    :root {
      --bg-base: #131314;
      --bg-card: #1e1f20;
      --border: #282a2c;
      --text: #e3e3e3;
      --text-muted: #a1a1a1;
      --accent: #a8c7fa;
      --success: #6ccb5f;
      --warning: #f28b82;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; user-select: none; }
    
    body {
      background-color: var(--bg-base); color: var(--text);
      /* Telegram Native Save Top Padding */
      padding-top: calc(var(--tg-safe-area-inset-top, 20px) + 10px); 
      padding-bottom: 70px; /* Space for tabs */
    }

    /* CRITICAL UI RULE: Solid White Background + Bold Black Text for inputs */
    input, select, textarea {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: bold !important;
      border: 1px solid var(--border);
      padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 15px;
      appearance: none;
    }
    
    /* Global Search & Assignee Filters */
    .header-controls { padding: 0 15px 15px 15px; position: sticky; top: 0; background: var(--bg-base); z-index: 100; }
    .filter-pills { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .pill { padding: 6px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; white-space: nowrap; transition: 0.2s;}
    .pill.active { background: var(--accent); color: var(--bg-base); font-weight: bold; border-color: var(--accent); }

    /* Core Layouts */
    .view-section { display: none; padding: 0 15px; }
    .view-section.active { display: block; }
    
    /* Folders & Cards */
    .folder-item, .job-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; position: relative; }
    .folder-item { display: flex; align-items: center; gap: 12px; font-weight: 600; cursor: pointer; }
    .job-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
    .job-title { font-size: 16px; font-weight: 700; color: var(--accent); }
    .folder-head-tag { font-size: 10px; background: rgba(168, 199, 250, 0.1); color: var(--accent); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);}
    
    /* Steps */
    .steps-container { display: none; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
    .job-card.expanded .steps-container { display: block; }
    .step-item { background: var(--bg-base); padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid var(--border); position: relative; }
    .step-item.completed { border-left-color: var(--success); opacity: 0.6; }
    .step-item.in-progress { border-left-color: var(--accent); }
    .step-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 10px; margin-top: 5px;}
    
    .btn { background: var(--accent); color: var(--bg-base); padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; cursor: pointer; width: 100%; border: none;}
    .btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); margin-top: 10px;}

    /* Bottom Navigation Tabs */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card); display: flex; border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); z-index: 1000;}
    .nav-tab { flex: 1; text-align: center; padding: 15px 0; font-size: 12px; font-weight: bold; color: var(--text-muted); }
    .nav-tab.active { color: var(--accent); border-top: 2px solid var(--accent); }

    /* Modals & Overlays */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: flex-end;}
    .modal-content { background: var(--bg-base); width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto;}
    
    /* Loader & Toast */
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(19, 19, 20, 0.9); z-index: 3000; display: flex; justify-content: center; align-items: center; }
    .spinner { border: 4px solid var(--bg-card); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: var(--bg-base); padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 2500;}
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Context Menu Drawer */
    #context-menu { flex-direction: column; gap: 10px; }
    .ctx-btn { padding: 15px; background: var(--bg-card); border-radius: 12px; text-align: left; display: flex; gap: 15px; font-weight: bold; }
    .ctx-btn.danger { color: var(--warning); }
  </style>
</head>
<body>

  <!-- Fullscreen Loader -->
  <div id="loader"><div class="spinner"></div></div>

  <!-- Header Controls -->
  <div class="header-controls">
    <input type="text" id="global-search" placeholder="🔍 Deep Search..." oninput="renderView()">
    <div class="filter-pills" id="assignee-filters">
      <div class="pill active" onclick="setAssigneeFilter('ALL')">ALL</div>
      <div class="pill" onclick="setAssigneeFilter('JEEVAN')">JEEVAN</div>
      <div class="pill" onclick="setAssigneeFilter('RAVI KUMAR')">RAVI KUMAR</div>
      <div class="pill" onclick="setAssigneeFilter('SANANTH')">SANANTH</div>
      <div class="pill" onclick="setAssigneeFilter('UNASSIGNED')">UNASSIGNED</div>
    </div>
  </div>

  <!-- Main View Areas -->
  <div id="view-tree" class="view-section active"></div>
  <div id="view-schedule" class="view-section">
    <div class="filter-pills" style="margin-bottom: 15px;">
      <div class="pill active" id="tab-today" onclick="setSubTab('TODAY')">TODAY</div>
      <div class="pill" id="tab-deadline" onclick="setSubTab('DEADLINE')">DEADLINE</div>
      <div class="pill" id="tab-queue" onclick="setSubTab('QUEUE')">QUEUE</div>
    </div>
    <div id="schedule-content"></div>
  </div>
  <div id="view-others" class="view-section">
    <div class="folder-item" onclick="openArchive()"><span style="font-size:24px">✅</span> Completed Archive</div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-tab active" id="nav-tree" onclick="switchMainTab('tree')">TREE</div>
    <div class="nav-tab" id="nav-schedule" onclick="switchMainTab('schedule')">SCHEDULE</div>
    <div class="nav-tab" id="nav-others" onclick="switchMainTab('others')">OTHERS</div>
  </div>

  <!-- Action Floating Button -->
  <div style="position:fixed; bottom: 80px; right: 20px; z-index:500;">
    <button class="btn" style="width: 50px; height: 50px; border-radius: 25px; font-size: 24px;" onclick="openCreateModal()">+</button>
  </div>

  <!-- Toast -->
  <div id="toast">Action Successful</div>

  <!-- Modals -->
  <!-- 1. Context Menu -->
  <div class="modal-overlay" id="modal-context" onclick="closeModal('modal-context')">
    <div class="modal-content" id="context-menu" onclick="event.stopPropagation()">
      <div class="ctx-btn" onclick="executeContext('edit')">✏️ Edit Full</div>
      <div class="ctx-btn" onclick="executeContext('duplicate')">📋 Duplicate</div>
      <div class="ctx-btn danger" onclick="executeContext('delete')">🗑️ Delete</div>
    </div>
  </div>

  <!-- 2. Form Modal (Dynamic for Folder/Job/Step) -->
  <div class="modal-overlay" id="modal-form" onclick="closeModal('modal-form')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="form-title" style="margin-bottom: 15px;">Create Item</h3>
      <div id="form-body"></div>
      <button class="btn" onclick="saveForm()">Save & Sync</button>
      <button class="btn btn-secondary" onclick="closeModal('modal-form')">Cancel</button>
    </div>
  </div>

  <script>
    // --- TELEGRAM SETUP ---
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor('#131314');
    
    // Web Audio Chimes
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChime(type) {
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      if(type === 'success') {
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      } else {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      }
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // --- STATE MANAGEMENT ---
    // Change this endpoint to your Cloudflare Worker URL
    const API_BASE = "https://your-worker-url.workers.dev/api"; 
    
    let db = { folders: [], jobCards: [], processSteps: [] };
    let currentMainTab = 'tree';
    let currentFolderId = ''; // Root is empty
    let folderHistory = [];
    let currentAssigneeFilter = 'ALL';
    let currentSubTab = 'TODAY';
    let contextTarget = null; // { type: 'folder'|'job'|'step', id: '' }

    // API Wrapper
    async function apiCall(endpoint, method = 'GET', body = null) {
      document.getElementById('loader').style.display = 'flex';
      const headers = {
        'Content-Type': 'application/json',
        'X-Telegram-User-Id': tg.initDataUnsafe?.user?.id?.toString() || '8545698010' // fallback for local test
      };
      const options = { method, headers };
      if(body) options.body = method === 'POST' || method === 'PATCH' ? (typeof body === 'string' ? body : JSON.stringify(body)) : body;
      
      try {
        const res = await fetch(`${API_BASE}${endpoint}`, options);
        if(!res.ok) throw new Error(await res.text());
        const data = await res.json();
        document.getElementById('loader').style.display = 'none';
        return data;
      } catch (err) {
        document.getElementById('loader').style.display = 'none';
        showToast('Error: ' + err.message);
        throw err;
      }
    }

    // --- INITIALIZATION ---
    async function initApp() {
      tg.BackButton.onClick(() => handleBack());
      await loadData();
    }

    async function loadData() {
      const data = await apiCall('/data');
      db.folders = data.folders || [];
      db.jobCards = data.jobCards || [];
      db.processSteps = data.processSteps || [];
      renderView();
    }

    // --- NAVIGATION & RENDERING ---
    function switchMainTab(tab) {
      currentMainTab = tab;
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(`view-${tab}`).classList.add('active');
      document.getElementById(`nav-${tab}`).classList.add('active');
      
      if(tab === 'tree') tg.BackButton[currentFolderId ? 'show' : 'hide']();
      else tg.BackButton.hide();
      
      renderView();
    }

    function handleBack() {
      if(folderHistory.length > 0) {
        currentFolderId = folderHistory.pop();
        tg.BackButton[folderHistory.length > 0 ? 'show' : 'hide']();
        renderView();
      }
    }

    function openFolder(fId) {
      folderHistory.push(currentFolderId);
      currentFolderId = fId;
      tg.BackButton.show();
      renderView();
    }

    function setAssigneeFilter(assignee) {
      currentAssigneeFilter = assignee;
      document.querySelectorAll('#assignee-filters .pill').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      renderView();
    }

    function setSubTab(tab) {
      currentSubTab = tab;
      document.querySelectorAll('#view-schedule .pill').forEach(p => p.classList.remove('active'));
      document.getElementById(`tab-${tab.toLowerCase()}`).classList.add('active');
      renderView();
    }

    function toggleJob(jobId) {
      const el = document.getElementById(`job-${jobId}`);
      el.classList.toggle('expanded');
      const toggleBtn = el.querySelector('.job-toggle-btn');
      toggleBtn.innerText = el.classList.contains('expanded') ? 'v' : '^';
    }

    // Deep search logic
    function matchSearch(str, query) {
      if(!query) return true;
      return str.toLowerCase().includes(query.toLowerCase());
    }

    function renderView() {
      const q = document.getElementById('global-search').value;
      if (currentMainTab === 'tree') renderTree(q);
      else if (currentMainTab === 'schedule') renderSchedule(q);
    }

    function renderTree(query) {
      const container = document.getElementById('view-tree');
      container.innerHTML = '';

      // 1. Render Folders in current scope
      const folders = db.folders.filter(f => 
        (query ? matchSearch(f[1], query) : (f[2] || '') === currentFolderId)
      );
      
      folders.forEach(f => {
        const div = document.createElement('div');
        div.className = 'folder-item';
        div.innerHTML = `<span style="font-size:24px">📁</span> <span>${f[1]}</span>`;
        div.onclick = () => openFolder(f[0]);
        div.oncontextmenu = (e) => showContext(e, 'folder', f[0]);
        addLongPress(div, 'folder', f[0]);
        container.appendChild(div);
      });

      // 2. Render Job Cards in current scope
      const jobs = db.jobCards.filter(j => 
        j[5] !== 'TRUE' && // Not archived
        (query ? matchSearch(j[2], query) : (j[1] || '') === currentFolderId)
      );

      jobs.forEach(j => {
        const div = document.createElement('div');
        div.className = 'job-card';
        div.id = `job-${j[0]}`;
        
        let steps = db.processSteps.filter(s => s[1] === j[0]);
        
        // Filter by assignee
        if(currentAssigneeFilter !== 'ALL') {
          steps = steps.filter(s => s[3] === currentAssigneeFilter || (currentAssigneeFilter==='UNASSIGNED' && !s[3]));
          if(steps.length === 0 && !query) return; // hide job if no steps match
        }

        // Sort completed to bottom
        steps.sort((a,b) => (a[4]==='Completed' ? 1 : 0) - (b[4]==='Completed' ? 1 : 0));
        const allCompleted = steps.length > 0 && steps.every(s => s[4] === 'Completed');

        div.innerHTML = `
          <div class="job-header" onclick="toggleJob('${j[0]}')">
            <div>
              <div class="job-title">${j[2]}</div>
              ${j[4] ? `<span class="folder-head-tag">Head: ${j[4]}</span>` : ''}
            </div>
            <div class="job-toggle-btn" style="padding:10px;">^</div>
          </div>
          <div class="steps-container">
            ${steps.map(s => `
              <div class="step-item ${s[4]==='Completed'?'completed':(s[4]==='In Progress'?'in-progress':'')}" oncontextmenu="showContext(event, 'step', '${s[0]}')">
                <div style="font-weight:bold;">${s[2]}</div>
                <div class="step-meta">
                  <span>👤 ${s[3] || 'Unassigned'}</span>
                  <span>📅 ${s[5] || '-'} ${s[6] || '-'}</span>
                  <span>⚙️ ${s[4]}</span>
                </div>
                ${s[7] ? `<a href="${s[7]}" target="_blank" style="color:var(--accent); font-size:11px; display:block; margin-top:5px;">📎 Attachment</a>` : ''}
              </div>
            `).join('')}
            ${allCompleted ? `<button class="btn btn-secondary" onclick="archiveJob('${j[0]}')">📦 Archive Job</button>` : ''}
          </div>
        `;
        
        // Attach long press to header
        const header = div.querySelector('.job-header');
        header.oncontextmenu = (e) => { e.stopPropagation(); showContext(e, 'job', j[0]); };
        addLongPress(header, 'job', j[0]);

        // Attach long press to steps
        div.querySelectorAll('.step-item').forEach((stepEl, idx) => {
           addLongPress(stepEl, 'step', steps[idx][0]);
        });

        container.appendChild(div);
      });
    }

    function renderSchedule(query) {
       const container = document.getElementById('schedule-content');
       container.innerHTML = '';
       
       let steps = db.processSteps.filter(s => s[4] !== 'Completed');
       if(currentAssigneeFilter !== 'ALL') {
          steps = steps.filter(s => s[3] === currentAssigneeFilter || (currentAssigneeFilter==='UNASSIGNED' && !s[3]));
       }
       if(query) steps = steps.filter(s => matchSearch(s[2], query));

       // Sort based on Date/Time (Dummy implementation for TODAY/DEADLINE/QUEUE structure)
       steps.forEach(s => {
          const j = db.jobCards.find(job => job[0] === s[1]);
          if(!j || j[5] === 'TRUE') return; // Skip archived or orphaned

          const div = document.createElement('div');
          div.className = 'job-card';
          div.innerHTML = `
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">📁 Job: ${j[2]}</div>
            <div class="step-item ${s[4]==='In Progress'?'in-progress':''}">
              <div style="font-weight:bold;">${s[2]}</div>
              <div class="step-meta">
                <span>👤 ${s[3] || 'Unassigned'}</span>
                <span>📅 ${s[5] || '-'} ${s[6] || '-'}</span>
              </div>
            </div>
            <select style="margin-top:10px; margin-bottom:0;" onchange="fastUpdateStepStatus('${s[0]}', this.value)">
                <option value="Not Started" ${s[4]==='Not Started'?'selected':''}>Not Started</option>
                <option value="In Progress" ${s[4]==='In Progress'?'selected':''}>In Progress</option>
                <option value="In Hold" ${s[4]==='In Hold'?'selected':''}>In Hold</option>
                <option value="Completed" ${s[4]==='Completed'?'selected':''}>Completed</option>
            </select>
          `;
          container.appendChild(div);
       });
    }

    function openArchive() {
       const jobs = db.jobCards.filter(j => j[5] === 'TRUE');
       // Quick inline render for archive
       const container = document.getElementById('view-others');
       container.innerHTML = '<div class="folder-item" onclick="renderView()"><span style="font-size:24px">⬅️</span> Back to Others</div><h3>Archived Jobs</h3>';
       jobs.forEach(j => {
          container.innerHTML += `<div class="job-card"><div class="job-title">${j[2]}</div></div>`;
       });
    }

    // --- ACTIONS & API ---
    async function fastUpdateStepStatus(stepId, status) {
        const stepRow = db.processSteps.find(s => s[0] === stepId);
        if(!stepRow) return;
        stepRow[4] = status; // Update local
        stepRow[12] = new Date().toISOString(); // Updated At
        
        tg.HapticFeedback.notificationOccurred('success');
        playChime('success');
        await apiCall('/steps', 'PATCH', stepRow);
        showToast('Status Updated');
        renderView();
    }

    async function archiveJob(jobId) {
        if(!confirm("Archive this job?")) return;
        await apiCall('/archive', 'POST', { jobId });
        playChime('success');
        showToast('Job Archived');
        await loadData(); // Full reload to get true state
    }

    // --- LONG PRESS & CONTEXT MENU ---
    let pressTimer;
    function addLongPress(el, type, id) {
       el.addEventListener('touchstart', (e) => {
         pressTimer = setTimeout(() => showContext(e, type, id), 500);
       }, {passive:true});
       el.addEventListener('touchend', () => clearTimeout(pressTimer));
       el.addEventListener('touchmove', () => clearTimeout(pressTimer));
       
       el.addEventListener('mousedown', (e) => {
         pressTimer = setTimeout(() => showContext(e, type, id), 500);
       });
       el.addEventListener('mouseup', () => clearTimeout(pressTimer));
       el.addEventListener('mousemove', () => clearTimeout(pressTimer));
    }

    function showContext(e, type, id) {
       e.preventDefault();
       tg.HapticFeedback.impactOccurred('heavy');
       contextTarget = { type, id };
       document.getElementById('modal-context').style.display = 'flex';
    }

    function closeModal(id) {
       document.getElementById(id).style.display = 'none';
    }

    async function executeContext(action) {
       closeModal('modal-context');
       const { type, id } = contextTarget;
       
       if (action === 'delete') {
          if(!confirm(`Delete this ${type}? This cannot be undone.`)) return;
          await apiCall('/delete', 'POST', { type, ids: [id] });
          playChime('delete');
          showToast('Item Deleted');
          await loadData();
       } 
       else if (action === 'edit') {
           // Basic routing to modal
           openCreateModal(type, id);
       }
    }

    // --- FORMS & MODALS ---
    let currentJobStepsBuilder = [];
    
    function openCreateModal(type = 'menu', id = null) {
       const body = document.getElementById('form-body');
       document.getElementById('modal-form').style.display = 'flex';
       
       if (type === 'menu') {
           document.getElementById('form-title').innerText = "Create New...";
           body.innerHTML = `
              <button class="btn" style="margin-bottom:10px;" onclick="openCreateModal('folder')">📁 New Folder</button>
              <button class="btn" onclick="openCreateModal('job')">⚙️ New Job Card</button>
           `;
           return;
       }

       if (type === 'folder') {
           document.getElementById('form-title').innerText = id ? "Edit Folder" : "New Folder";
           let f = id ? db.folders.find(x => x[0] === id) : ['f_'+Date.now(), '', currentFolderId, new Date().toISOString(), ''];
           body.innerHTML = `
             <input type="hidden" id="f_id" value="${f[0]}">
             <input type="hidden" id="f_parent" value="${f[2]}">
             <input type="hidden" id="f_created" value="${f[3]}">
             <label>Folder Name</label><input type="text" id="f_name" value="${f[1]}">
             <label>Category</label><input type="text" id="f_category" value="${f[4]}">
           `;
           contextTarget = { formType: 'folder' };
       }

       if (type === 'job') {
           document.getElementById('form-title').innerText = id ? "Edit Job" : "New Job Card";
           let j = id ? db.jobCards.find(x => x[0] === id) : ['j_'+Date.now(), currentFolderId, '', new Date().toISOString(), '', 'FALSE'];
           currentJobStepsBuilder = id ? JSON.parse(JSON.stringify(db.processSteps.filter(s => s[1] === id))) : [];
           
           renderJobForm(j);
           contextTarget = { formType: 'job', jobId: j[0] };
       }
    }

    function renderJobForm(j) {
        const body = document.getElementById('form-body');
        let stepsHtml = currentJobStepsBuilder.map((s, idx) => `
            <div style="border:1px solid var(--border); padding:10px; margin-bottom:10px; border-radius:8px;">
                <input type="text" placeholder="Step Title" value="${s[2]}" onchange="currentJobStepsBuilder[${idx}][2]=this.value">
                <select onchange="currentJobStepsBuilder[${idx}][3]=this.value">
                   <option value="">Assignee...</option>
                   <option value="JEEVAN" ${s[3]==='JEEVAN'?'selected':''}>JEEVAN</option>
                   <option value="RAVI KUMAR" ${s[3]==='RAVI KUMAR'?'selected':''}>RAVI KUMAR</option>
                   <option value="SANANTH" ${s[3]==='SANANTH'?'selected':''}>SANANTH</option>
                </select>
                <div style="display:flex; gap:10px;">
                    <input type="date" value="${s[5]}" onchange="currentJobStepsBuilder[${idx}][5]=this.value">
                    <input type="time" value="${s[6]}" onchange="currentJobStepsBuilder[${idx}][6]=this.value">
                </div>
                <textarea placeholder="Notes" onchange="currentJobStepsBuilder[${idx}][9]=this.value">${s[9]||''}</textarea>
                <input type="file" onchange="handleFileUpload(event, ${idx})">
                ${s[7] ? `<small>File Attached</small>` : ''}
            </div>
        `).join('');

        body.innerHTML = `
             <input type="hidden" id="j_id" value="${j[0]}">
             <input type="hidden" id="j_folder" value="${j[1]}">
             <input type="hidden" id="j_created" value="${j[3]}">
             <input type="hidden" id="j_archived" value="${j[5]}">
             
             <label>Job Title</label><input type="text" id="j_title" value="${j[2]}">
             <label>Folder Head ID</label><input type="text" id="j_head" value="${j[4]}">
             
             <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
             <h4>Operation Steps</h4>
             <div id="steps-builder-list" style="margin-top:10px;">${stepsHtml}</div>
             <button class="btn btn-secondary" onclick="addJobStep()">+ Add Operation Step</button>
        `;
    }

    function addJobStep() {
        const stepId = 's_' + Date.now();
        // Schema: Step_ID, Job_ID, Step_Title, Assignee, Status, Date, Time, Attachment_Url, Linked_Job, Notes, Category, Created_At, Updated_At
        currentJobStepsBuilder.push([stepId, contextTarget.jobId, '', '', 'Not Started', '', '', '', '', '', '', new Date().toISOString(), new Date().toISOString()]);
        renderJobForm([
           document.getElementById('j_id').value,
           document.getElementById('j_folder').value,
           document.getElementById('j_title').value,
           document.getElementById('j_created').value,
           document.getElementById('j_head').value,
           document.getElementById('j_archived').value
        ]);
    }

    async function handleFileUpload(e, idx) {
        const file = e.target.files[0];
        if(!file) return;
        document.getElementById('loader').style.display = 'flex';
        
        const reader = new FileReader();
        reader.onload = async () => {
            const base64Data = reader.result.split(',')[1];
            try {
                const res = await apiCall('/upload-drive-file', 'POST', {
                    fileName: file.name,
                    mimeType: file.type,
                    base64Data: base64Data,
                    folderPath: ["TRACE_Matrix", document.getElementById('j_title').value]
                });
                currentJobStepsBuilder[idx][7] = res.url; // Save URL from App Script
                showToast("File Uploaded");
            } catch(e) {
                showToast("Upload Failed");
            }
            document.getElementById('loader').style.display = 'none';
            // re-render form
            renderJobForm([document.getElementById('j_id').value, document.getElementById('j_folder').value, document.getElementById('j_title').value, document.getElementById('j_created').value, document.getElementById('j_head').value, document.getElementById('j_archived').value]);
        };
        reader.readAsDataURL(file);
    }

    async function saveForm() {
       if (contextTarget.formType === 'folder') {
           const payload = {
              Folder_ID: document.getElementById('f_id').value,
              Folder_Name: document.getElementById('f_name').value,
              Parent_Folder_ID: document.getElementById('f_parent').value,
              Created_At: document.getElementById('f_created').value,
              Category: document.getElementById('f_category').value
           };
           await apiCall('/folders', 'POST', payload);
       } else if (contextTarget.formType === 'job') {
           const jobRow = [
               document.getElementById('j_id').value,
               document.getElementById('j_folder').value,
               document.getElementById('j_title').value,
               document.getElementById('j_created').value,
               document.getElementById('j_head').value,
               document.getElementById('j_archived').value
           ];
           await apiCall('/jobcards', 'POST', { job: jobRow, steps: currentJobStepsBuilder });
       }
       
       closeModal('modal-form');
       playChime('success');
       showToast('Saved Successfully');
       await loadData();
    }

    function showToast(msg) {
       const t = document.getElementById('toast');
       t.innerText = msg;
       t.classList.add('show');
       setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Start App
    initApp();
  </script>
</body>
</html>
