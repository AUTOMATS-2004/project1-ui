<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TRACE MATRIX</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Mobile DevTools (Eruda) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #131314;
      --card-bg: #1e1f20;
      --card-hover: #28292a;
      --border-subtle: #2d2e31;
      
      --accent-blue: #a8c7fa;
      --accent-blue-bg: rgba(168, 199, 250, 0.12);
      --accent-purple: #d0bcff;
      --accent-purple-bg: rgba(208, 188, 255, 0.12);
      --accent-amber: #fdd663;
      --accent-amber-bg: rgba(253, 214, 99, 0.12);
      --accent-green: #6dd58c;
      --accent-green-bg: rgba(109, 213, 140, 0.12);
      --accent-red: #f28b82;

      --text-primary: #e3e3e3;
      --text-muted: #8e918f;
      --font-main: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-main);
      min-height: 100vh;
      padding-top: 135px; /* dynamically updated if bar toggled */
      padding-bottom: 90px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Fixed Top Bars */
    .top-fixed-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--bg-dark);
      z-index: 900;
      border-bottom: 1px solid var(--border-subtle);
      transition: all 0.2s ease;
    }

    /* DIAGNOSTIC / DEV BAR (HIDDEN BY DEFAULT) */
    .diagnostic-bar {
      background: #18191a;
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      display: none; /* Controlled by toggle */
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--accent-amber);
    }
    .diagnostic-bar.active { display: flex; }

    .search-row {
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nav-primary-wrapper {
      display: flex;
      align-items: center;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-dark);
    }

    .nav-primary {
      display: flex;
      flex: 1;
    }

    .primary-tab {
      flex: 1;
      padding: 10px 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
    }
    .primary-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }

    /* COLLAPSIBLE ROW WRAPPERS WITH RIGHT ARROW TOGGLES */
    .sub-filter-bar {
      background: #171819;
      border-top: 1px solid var(--border-subtle);
    }

    .collapsible-row-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .sub-row {
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }
    .sub-row::-webkit-scrollbar { display: none; }
    .sub-row.collapsed { display: none !important; }

    .row-toggle-btn {
      background: transparent;
      border: none;
      color: var(--accent-blue);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: bold;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chip-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 16px;
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
    }
    .chip-btn.active {
      background: var(--accent-blue-bg);
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .view-content { display: none; padding: 12px 14px; max-width: 850px; margin: 0 auto; }
    .view-content.active { display: block; }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-family: var(--font-mono);
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      position: relative;
      touch-action: pan-y;
    }
    .card-item:active { background: var(--card-hover); }

    .job-header { display: flex; justify-content: space-between; align-items: center; }
    .item-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }

    .step-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .step-list.collapsed { display: none; }
    .step-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      touch-action: pan-y;
    }

    .badge-status {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      font-family: var(--font-mono);
      cursor: pointer;
    }
    .status-notstarted { background: #2a2b2d; color: #a1a3a5; border: 1px solid #444; }
    .status-inprogress { background: var(--accent-purple-bg); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
    .status-inhold { background: var(--accent-amber-bg); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
    .status-completed { background: var(--accent-green-bg); color: var(--accent-green); border: 1px solid var(--accent-green); }

    /* FLOATING ACTION BUTTON (+) */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: #000;
      border: none;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      z-index: 700;
      box-shadow: 0 4px 20px rgba(168, 199, 250, 0.4);
    }

    /* ERUDA DEVELOPER BUTTON PINNED PERMANENTLY BOTTOM-LEFT */
    #eruda {
      display: none; /* Controlled by toggle */
    }
    .eruda-entry-btn {
      bottom: 24px !important;
      left: 20px !important;
      right: auto !important;
      top: auto !important;
    }

    /* MODAL SHEETS & DRAWERS */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }

    .modal-drawer {
      background: var(--card-bg);
      border-top: 1px solid var(--border-subtle);
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px 16px 36px 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    /* Strict High-Contrast Inputs */
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    select.form-select, input.form-input, textarea.form-textarea {
      width: 100%;
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 600 !important;
      border: 1.5px solid var(--accent-blue) !important;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    .btn-action {
      width: 100%;
      background: var(--accent-blue);
      color: #000000;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* CONTEXT MENU SHEET */
    .context-menu-sheet {
      background: var(--card-bg);
      border-top: 1px solid var(--border-subtle);
      border-radius: 16px 16px 0 0;
      width: 100%;
      padding: 16px;
    }
    .context-item {
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .context-item:last-child { border-bottom: none; }
    .context-item.danger { color: var(--accent-red); }

    .toast {
      position: fixed;
      top: 12px; left: 14px; right: 14px;
      background: var(--accent-blue);
      color: #000;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      z-index: 999999;
      display: none;
    }
    .toast.active { display: block; }
  </style>
</head>
<body>

  <div class="toast" id="toast-banner"></div>

  <!-- FIXED HEADER -->
  <header class="top-fixed-wrapper" id="top-header">
    
    <!-- DIAGNOSTIC BAR (Hidden by default, toggled via ^/v next to filters) -->
    <div class="diagnostic-bar" id="diagnostic-bar">
      <span id="diag-user">TG USER: INITIALIZING...</span>
      <span id="diag-status">STATUS: CONNECTING</span>
    </div>

    <!-- SEARCH & CONTROLS ROW -->
    <div class="search-row">
      <input
        type="text"
        id="global-search-input"
        class="form-input"
        style="margin-bottom:0; padding:8px 12px; font-size:13px;"
        placeholder="🔍 Search Specs, Ops, Jobs..."
        oninput="handleSearch(this.value)"
      />
      <button class="chip-btn" onclick="openFilterModal()">⚙️ Filters</button>
      <!-- TOGGLE FOR DIAGNOSTICS & DEV TOOLS -->
      <button class="chip-btn" id="diag-toggle-btn" onclick="toggleDiagnosticBar()" title="Toggle Diagnostics & Dev Tools">▾ Dev</button>
    </div>

    <!-- PRIMARY TABS -->
    <div class="nav-primary-wrapper">
      <nav class="nav-primary">
        <button class="primary-tab active" id="tab-btn-tree" onclick="switchTab('tree')">TREE</button>
        <button class="primary-tab" id="tab-btn-schedule" onclick="switchTab('schedule')">SCHEDULE</button>
        <button class="primary-tab" id="tab-btn-others" onclick="switchTab('others')">OTHERS</button>
      </nav>
    </div>

    <!-- COLLAPSIBLE SUB-BARS -->
    <div class="sub-filter-bar">
      <!-- SCHEDULE SUB-ROW (Only visible on SCHEDULE tab) -->
      <div class="collapsible-row-container" id="schedule-sub-nav-wrapper" style="display:none;">
        <div class="sub-row" id="schedule-sub-nav">
          <button class="chip-btn active" onclick="setScheduleSub('today', this)">TODAY</button>
          <button class="chip-btn" onclick="setScheduleSub('deadline', this)">DEADLINE</button>
          <button class="chip-btn" onclick="setScheduleSub('queue', this)">QUEUE</button>
        </div>
        <button class="row-toggle-btn" onclick="toggleSubRow('schedule-sub-nav', this)">▴</button>
      </div>

      <!-- ASSIGNEE FILTER ROW -->
      <div class="collapsible-row-container" id="assignee-filter-wrapper">
        <div class="sub-row" id="assignee-filter-bar">
          <button class="chip-btn active" onclick="setAssignee('ALL', this)">ALL</button>
          <button class="chip-btn" onclick="setAssignee('JEEVAN', this)">JEEVAN</button>
          <button class="chip-btn" onclick="setAssignee('RAVI KUMAR', this)">RAVI KUMAR</button>
          <button class="chip-btn" onclick="setAssignee('SANANTH', this)">SANANTH</button>
          <button class="chip-btn" onclick="setAssignee('UNASSIGNED', this)">UNASSIGNED</button>
        </div>
        <button class="row-toggle-btn" onclick="toggleSubRow('assignee-filter-bar', this)">▴</button>
      </div>
    </div>
  </header>

  <!-- TAB 1: TREE -->
  <main id="page-tree" class="view-content active">
    <div class="breadcrumbs" id="tree-breadcrumbs"></div>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <button class="chip-btn" onclick="openFolderModal()">+ New Folder</button>
      <button class="chip-btn" onclick="openJobModal()">+ New Job Card</button>
    </div>
    <div id="tree-container"></div>
  </main>

  <!-- TAB 2: SCHEDULE -->
  <main id="page-schedule" class="view-content">
    <div id="schedule-container"></div>
  </main>

  <!-- TAB 3: OTHERS -->
  <main id="page-others" class="view-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <button class="chip-btn" onclick="openCategoryModal()">+ Add Category</button>
    </div>
    <div id="others-container"></div>
    <div style="margin-top:24px;">
      <div style="font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase;">Archive Storage</div>
      <div class="card-item" onclick="toggleExpand('archive-list')">
        <div class="job-header">
          <span class="item-title">📦 Completed Archive</span>
          <span id="arr-archive-list" style="color:var(--accent-blue);">v</span>
        </div>
        <div class="step-list collapsed" id="steps-archive-list"></div>
      </div>
    </div>
  </main>

  <!-- FAB (+) -->
  <button class="fab" onclick="openJobModal()">+</button>

  <!-- FILTER & SORT MODAL -->
  <div class="modal-overlay" id="modal-filter">
    <div class="modal-drawer">
      <div class="modal-header">
        <h3 style="font-size:16px;">Filter & Sort Options</h3>
        <button class="chip-btn" onclick="closeModal('modal-filter')">✕</button>
      </div>
      <div>
        <label class="form-label">Sort Order</label>
        <select id="filter-sort-select" class="form-select">
          <option value="default">Default</option>
          <option value="title-asc">Title: A ➔ Z</option>
          <option value="title-desc">Title: Z ➔ A</option>
          <option value="date-newest">Date: Newest First</option>
          <option value="date-oldest">Date: Oldest First</option>
        </select>

        <label class="form-label">Status Scope</label>
        <select id="filter-status-select" class="form-select">
          <option value="ALL">All Statuses</option>
          <option value="Not Started">Not Started</option>
          <option value="In Progress">In Progress</option>
          <option value="In Hold">In Hold</option>
          <option value="Completed">Completed</option>
        </select>

        <label class="form-label">Folder Scope</label>
        <select id="filter-folder-select" class="form-select">
          <option value="ALL">All System Folders</option>
        </select>

        <div style="display:flex; gap:8px; margin-top:14px;">
          <button type="button" class="btn-action" onclick="applyAdvancedFilters()">Apply Filters</button>
          <button type="button" class="chip-btn" style="padding:12px;" onclick="resetAdvancedFilters()">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JOB CARD BUILDER MODAL -->
  <div class="modal-overlay" id="modal-job">
    <div class="modal-drawer">
      <div class="modal-header">
        <h3 id="job-modal-title" style="font-size:16px;">Job Card Builder</h3>
        <button class="chip-btn" onclick="closeModal('modal-job')">✕</button>
      </div>
      <form onsubmit="saveJobCard(event)">
        <input type="hidden" id="job-edit-id" value="" />
        <label class="form-label">Job Title</label>
        <input type="text" id="job-title-input" class="form-input" required placeholder="e.g. Worm Gear Batch" />

        <label class="form-label">Target Folder</label>
        <select id="job-folder-select" class="form-select"></select>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <label class="form-label" style="margin:0;">Operations</label>
          <button type="button" class="chip-btn" onclick="addBuilderStep()">+ Add Operation</button>
        </div>
        <div id="builder-steps-container"></div>

        <button type="submit" class="btn-action" style="margin-top:12px;">Save Job Card</button>
      </form>
    </div>
  </div>

  <!-- FOLDER MODAL -->
  <div class="modal-overlay" id="modal-folder">
    <div class="modal-drawer">
      <div class="modal-header">
        <h3 id="folder-modal-title" style="font-size:16px;">New Folder</h3>
        <button class="chip-btn" onclick="closeModal('modal-folder')">✕</button>
      </div>
      <form onsubmit="saveFolder(event)">
        <input type="hidden" id="folder-edit-id" value="" />
        <label class="form-label">Folder Name</label>
        <input type="text" id="folder-name-input" class="form-input" required placeholder="e.g., TURNING DEPT" />
        <button type="submit" class="btn-action">Save Folder</button>
      </form>
    </div>
  </div>

  <!-- CATEGORY MODAL -->
  <div class="modal-overlay" id="modal-category">
    <div class="modal-drawer">
      <div class="modal-header">
        <h3 style="font-size:16px;">New Category</h3>
        <button class="chip-btn" onclick="closeModal('modal-category')">✕</button>
      </div>
      <form onsubmit="saveCategory(event)">
        <label class="form-label">Category Name</label>
        <input type="text" id="category-name-input" class="form-input" required placeholder="e.g., ⚡ Calibration" />
        <button type="submit" class="btn-action">Create Category</button>
      </form>
    </div>
  </div>

  <!-- STEP EDIT MODAL -->
  <div class="modal-overlay" id="modal-step-edit">
    <div class="modal-drawer">
      <div class="modal-header">
        <h3 style="font-size:16px;">Edit Operation Step</h3>
        <button class="chip-btn" onclick="closeModal('modal-step-edit')">✕</button>
      </div>
      <form onsubmit="saveStepEdit(event)">
        <input type="hidden" id="step-edit-id" value="" />
        <label class="form-label">Step Title</label>
        <input type="text" id="step-edit-title" class="form-input" required />

        <label class="form-label">Assignee</label>
        <select id="step-edit-assignee" class="form-select">
          <option value="UNASSIGNED">UNASSIGNED</option>
          <option value="JEEVAN">JEEVAN</option>
          <option value="RAVI KUMAR">RAVI KUMAR</option>
          <option value="SANANTH">SANANTH</option>
        </select>

        <label class="form-label">Status</label>
        <select id="step-edit-status" class="form-select">
          <option value="Not Started">Not Started</option>
          <option value="In Progress">In Progress</option>
          <option value="In Hold">In Hold</option>
          <option value="Completed">Completed</option>
        </select>

        <label class="form-label">Due Date</label>
        <input type="date" id="step-edit-date" class="form-input" />

        <label class="form-label">Notes & Specifications</label>
        <textarea id="step-edit-notes" class="form-textarea" rows="3" placeholder="Shop floor notes..."></textarea>

        <button type="submit" class="btn-action">Update Operation</button>
      </form>
    </div>
  </div>

  <!-- CONTEXT MENU MODAL -->
  <div class="modal-overlay" id="modal-context">
    <div class="context-menu-sheet">
      <div style="font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:10px;" id="context-menu-title">OPTIONS</div>
      <div class="context-item" onclick="triggerContextAction('edit')">✏️ Edit / View Details</div>
      <div class="context-item" onclick="triggerContextAction('location')">📁 Open Folder Location</div>
      <div class="context-item" onclick="triggerContextAction('duplicate')">📋 Duplicate</div>
      <div class="context-item danger" onclick="triggerContextAction('delete')">🗑️ Delete Permanently</div>
    </div>
  </div>

  <script>
    const API_URL = "https://project1-brain.aeijeevan.workers.dev";
    const tg = window.Telegram?.WebApp;

    // Mobile Number Mapping
    const USER_DIRECTORY = {
      "8822239844": { name: "RAVI KUMAR", phone: "+918660300799" },
      "7282532775": { name: "JEEVAN", phone: "+918748818709" },
      "8545698010": { name: "SANANTH", phone: "+919483049830" }
    };

    // Application Central State
    const state = {
      tab: 'tree',
      scheduleSub: 'today',
      assignee: 'ALL',
      search: '',
      currentFolder: 'root',
      filterSort: 'default',
      filterStatus: 'ALL',
      filterFolder: 'ALL',
      folders: [
        { id: 'root', name: 'Root', parentId: null }
      ],
      jobs: [],
      categories: [
        { id: 'cat-1', name: '🚨 Urgent' },
        { id: 'cat-2', name: '⚙️ Calibration' }
      ],
      builderSteps: [],
      devMode: false,
      contextTarget: null // { type: 'folder'|'job'|'step', item: any, parentJob: any }
    };

    // Resolve Current User Phone Number
    let userId = "8822239844"; // Fallback Ravi Kumar
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.initDataUnsafe?.user?.id) {
          userId = String(tg.initDataUnsafe.user.id);
        }
      }
    } catch(e) {}

    const currentUserInfo = USER_DIRECTORY[userId] || { name: "Authorized User", phone: userId };
    document.getElementById('diag-user').innerText = `TG USER: ${currentUserInfo.phone} (${currentUserInfo.name})`;

    // Initialize Eruda for inspection
    try {
      eruda.init({
        defaults: {
          displaySize: 50,
          theme: 'Dark'
        }
      });
      // Eruda starts hidden until user toggles dev button
      const erudaEl = document.getElementById('eruda');
      if (erudaEl) erudaEl.style.display = 'none';
    } catch(e) {}

    // Global Error Catcher
    window.onerror = function(msg, url, line) {
      showToast(`Error L${line}: ${msg}`, true);
    };

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast-banner');
      t.innerText = msg;
      t.style.background = isError ? 'var(--accent-red)' : 'var(--accent-blue)';
      t.style.color = isError ? '#fff' : '#000';
      t.classList.add('active');
      setTimeout(() => t.classList.remove('active'), 3500);
    }

    // Toggle Diagnostic Bar & Developer Tools
    function toggleDiagnosticBar() {
      state.devMode = !state.devMode;
      const bar = document.getElementById('diagnostic-bar');
      const btn = document.getElementById('diag-toggle-btn');
      const erudaEl = document.getElementById('eruda');

      if (state.devMode) {
        bar.classList.add('active');
        btn.innerText = '▴ Dev';
        if (erudaEl) erudaEl.style.display = 'block';
      } else {
        bar.classList.remove('active');
        btn.innerText = '▾ Dev';
        if (erudaEl) {
          erudaEl.style.display = 'none';
          try { eruda.hide(); } catch(e) {}
        }
      }
      adjustBodyPadding();
    }

    // Toggle Sub-Row visibility (Collapse ^ / v)
    function toggleSubRow(rowId, btnEl) {
      const row = document.getElementById(rowId);
      if (row.classList.contains('collapsed')) {
        row.classList.remove('collapsed');
        btnEl.innerText = '▴';
      } else {
        row.classList.add('collapsed');
        btnEl.innerText = '▾';
      }
      adjustBodyPadding();
    }

    function adjustBodyPadding() {
      setTimeout(() => {
        const topH = document.getElementById('top-header').offsetHeight;
        document.body.style.paddingTop = `${topH + 12}px`;
      }, 50);
    }

    // Direct Initial Render
    renderAll();
    adjustBodyPadding();
    fetchLive();

    async function fetchLive() {
      const diagStatus = document.getElementById('diag-status');
      try {
        diagStatus.innerText = "STATUS: SYNCING...";
        const res = await fetch(`${API_URL}/api/data`, {
          headers: {
            'X-Telegram-User-Id': userId,
            'X-Telegram-Init-Data': tg?.initData || ''
          }
        });

        if (!res.ok) {
          const errText = await res.text();
          diagStatus.innerText = `HTTP ${res.status}: ${res.status === 403 ? 'USER NOT WHITELISTED' : 'SERVER ERR'}`;
          diagStatus.style.color = 'var(--accent-red)';
          showToast(`Auth / Sync Notice: ${errText || res.status}`, true);
          return;
        }

        const data = await res.json();
        if (data.folders) {
          state.folders = [{ id: 'root', name: 'Root', parentId: null }, ...data.folders];
        }
        if (data.jobCards) {
          state.jobs = data.jobCards;
        }

        diagStatus.innerText = "STATUS: ONLINE (SSOT)";
        diagStatus.style.color = 'var(--accent-green)';
        renderAll();
      } catch (err) {
        diagStatus.innerText = "STATUS: OFFLINE";
        diagStatus.style.color = 'var(--accent-amber)';
      }
    }

    function switchTab(t) {
      state.tab = t;
      document.querySelectorAll('.primary-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));

      document.getElementById(`tab-btn-${t}`).classList.add('active');
      document.getElementById(`page-${t}`).classList.add('active');

      const schedRow = document.getElementById('schedule-sub-nav-wrapper');
      schedRow.style.display = (t === 'schedule') ? 'flex' : 'none';

      adjustBodyPadding();
      renderAll();
    }

    function setScheduleSub(sub, el) {
      state.scheduleSub = sub;
      document.querySelectorAll('#schedule-sub-nav .chip-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderSchedule();
    }

    function setAssignee(assignee, el) {
      state.assignee = assignee;
      document.querySelectorAll('#assignee-filter-bar .chip-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderAll();
    }

    function handleSearch(val) {
      state.search = val.toLowerCase().trim();
      renderAll();
    }

    // Deep Filter and Sorting Engine
    function filterJobs(jobsList) {
      let filtered = [...jobsList];

      // Folder Scope Filter
      if (state.filterFolder !== 'ALL') {
        filtered = filtered.filter(j => j.folderId === state.filterFolder);
      }

      // Assignee Filter
      if (state.assignee !== 'ALL') {
        filtered = filtered.filter(j => j.steps.some(s => s.assignee === state.assignee));
      }

      // Status Scope Filter
      if (state.filterStatus !== 'ALL') {
        filtered = filtered.filter(j => j.steps.some(s => s.status === state.filterStatus));
      }

      // Global Search Filter (Deep across title, steps, notes)
      if (state.search) {
        filtered = filtered.filter(j => {
          const titleMatch = j.title.toLowerCase().includes(state.search);
          const stepMatch = j.steps.some(s =>
            s.title.toLowerCase().includes(state.search) ||
            (s.notes && s.notes.toLowerCase().includes(state.search)) ||
            (s.assignee && s.assignee.toLowerCase().includes(state.search))
          );
          return titleMatch || stepMatch;
        });
      }

      // Sorting
      if (state.filterSort === 'title-asc') {
        filtered.sort((a, b) => a.title.localeCompare(b.title));
      } else if (state.filterSort === 'title-desc') {
        filtered.sort((a, b) => b.title.localeCompare(a.title));
      } else if (state.filterSort === 'date-newest') {
        filtered.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      } else if (state.filterSort === 'date-oldest') {
        filtered.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
      }

      return filtered;
    }

    function renderAll() {
      renderTree();
      renderSchedule();
      renderOthers();
    }

    function renderTree() {
      const container = document.getElementById('tree-container');
      const breadcrumbs = document.getElementById('tree-breadcrumbs');
      container.innerHTML = '';

      const curFolder = state.folders.find(f => f.id === state.currentFolder) || { id: 'root', name: 'Root' };
      breadcrumbs.innerHTML = `
        <span onclick="navigateToFolder('root')" style="color:var(--accent-blue); cursor:pointer;">Root</span>
        ${curFolder.id !== 'root' ? `➔ <span style="color:#fff; font-weight:bold;">${curFolder.name}</span>` : ''}
      `;

      let flds = state.folders.filter(f => f.parentId === state.currentFolder && f.id !== 'root');
      let jbs = state.jobs.filter(j => j.folderId === state.currentFolder && !j.isArchived);

      // Search and Advanced Filters
      if (state.search || state.filterFolder !== 'ALL' || state.filterStatus !== 'ALL' || state.assignee !== 'ALL' || state.filterSort !== 'default') {
        if (state.search) {
          flds = state.folders.filter(f => f.id !== 'root' && f.name.toLowerCase().includes(state.search));
        }
        jbs = filterJobs(state.jobs.filter(j => !j.isArchived));
      }

      flds.forEach(f => {
        const div = document.createElement('div');
        div.className = 'card-item';
        div.innerHTML = `
          <div class="job-header">
            <span class="item-title">📁 ${f.name}</span>
            <span style="color:var(--text-muted);">➔</span>
          </div>
        `;
        div.onclick = (e) => {
          if (div.dataset.longPressed === 'true') return;
          navigateToFolder(f.id);
        };
        attachLongPress(div, 'folder', f);
        container.appendChild(div);
      });

      jbs.forEach(j => {
        const div = document.createElement('div');
        div.className = 'card-item';
        
        // Auto-sorting inside cards: Completed steps moved to bottom
        const sortedSteps = [...j.steps].sort((a, b) => {
          if (a.status === 'Completed' && b.status !== 'Completed') return 1;
          if (a.status !== 'Completed' && b.status === 'Completed') return -1;
          return 0;
        });

        const allCompleted = sortedSteps.length > 0 && sortedSteps.every(s => s.status === 'Completed');

        div.innerHTML = `
          <div class="job-header" onclick="toggleExpand('job-${j.id}')">
            <div>
              <span class="item-title">⚙️ ${j.title}</span>
              ${j.folderHeadId ? `<span style="font-size:10px; margin-left:6px; color:var(--accent-purple);">#${j.folderHeadId}</span>` : ''}
            </div>
            <span id="arr-job-${j.id}" style="color:var(--accent-blue); font-weight:bold;">v</span>
          </div>
          <div class="step-list" id="steps-job-${j.id}">
            ${sortedSteps.map(s => renderStepHTML(s, j)).join('')}
            ${allCompleted ? `<button class="btn-action" style="margin-top:8px; background:var(--accent-green); color:#000;" onclick="archiveJob('${j.id}')">📦 Archive Completed Job</button>` : ''}
          </div>
        `;
        attachLongPress(div, 'job', j);
        container.appendChild(div);
      });

      if (flds.length === 0 && jbs.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">No matching folders or job cards found.</div>`;
      }
    }

    function renderSchedule() {
      const c = document.getElementById('schedule-container');
      c.innerHTML = '';

      const todayStr = new Date().toISOString().split('T')[0];
      const activeJobs = filterJobs(state.jobs.filter(j => !j.isArchived));
      let operations = [];

      activeJobs.forEach(j => {
        j.steps.forEach(s => {
          if (state.assignee !== 'ALL' && s.assignee !== state.assignee) return;
          if (state.filterStatus !== 'ALL' && s.status !== state.filterStatus) return;

          if (state.scheduleSub === 'today') {
            if (s.date === todayStr) operations.push({ step: s, job: j });
          } else if (state.scheduleSub === 'deadline') {
            if (s.date && s.status !== 'Completed') operations.push({ step: s, job: j });
          } else {
            operations.push({ step: s, job: j });
          }
        });
      });

      if (state.scheduleSub === 'deadline') {
        operations.sort((a, b) => (a.step.date || '').localeCompare(b.step.date || ''));
      }

      operations.forEach(({ step, job }) => {
        const div = document.createElement('div');
        div.className = 'card-item';
        div.innerHTML = `
          <div style="font-size:11px; color:var(--accent-purple); font-weight:bold; margin-bottom:6px;">JOB: ${job.title}</div>
          ${renderStepHTML(step, job)}
        `;
        attachLongPress(div, 'step', step, job);
        c.appendChild(div);
      });

      if (operations.length === 0) {
        c.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">No scheduled operations match your filters.</div>`;
      }
    }

    function renderOthers() {
      const c = document.getElementById('others-container');
      c.innerHTML = state.categories.map(cat => `
        <div class="card-item">
          <div class="job-header">
            <span class="item-title">${cat.name}</span>
          </div>
        </div>
      `).join('');

      // Render Archive List
      const archContainer = document.getElementById('steps-archive-list');
      const archivedJobs = state.jobs.filter(j => j.isArchived);
      archContainer.innerHTML = archivedJobs.length ? archivedJobs.map(j => `
        <div class="step-card" style="display:flex; justify-content:space-between; align-items:center;">
          <span>📦 ${j.title}</span>
          <button class="chip-btn" onclick="unarchiveJob('${j.id}')">Unarchive</button>
        </div>
      `).join('') : `<div style="font-size:12px; color:var(--text-muted); padding:6px;">No archived jobs.</div>`;
    }

    function renderStepHTML(step, job) {
      const sc = `status-${step.status.toLowerCase().replace(/\s/g, '')}`;
      return `
        <div class="step-card" id="step-node-${step.id}">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:13px; font-weight:600;">${step.title}</span>
            <span class="badge-status ${sc}" onclick="cycleStep('${step.id}', event)">${step.status}</span>
          </div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">
            👤 ${step.assignee} ${step.date ? `| 📅 ${step.date}` : ''}
          </div>
          ${step.notes ? `<div style="font-size:10px; color:#aaa; margin-top:4px; font-family:var(--font-mono);">${step.notes}</div>` : ''}
        </div>
      `;
    }

    function toggleExpand(id) {
      const el = document.getElementById(`steps-${id}`);
      const arr = document.getElementById(`arr-${id}`);
      if (el) {
        if (el.classList.contains('collapsed')) {
          el.classList.remove('collapsed');
          if (arr) arr.innerText = 'v';
        } else {
          el.classList.add('collapsed');
          if (arr) arr.innerText = '^';
        }
      }
    }

    // Step Status Cycling
    function cycleStep(stepId, e) {
      if (e) e.stopPropagation();
      const seq = ['Not Started', 'In Progress', 'In Hold', 'Completed'];
      for (const j of state.jobs) {
        const s = j.steps.find(st => st.id === stepId);
        if (s) {
          const nextIdx = (seq.indexOf(s.status) + 1) % seq.length;
          s.status = seq[nextIdx];
          renderAll();

          fetch(`${API_URL}/api/steps`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
            body: JSON.stringify({ stepId: s.id, status: s.status })
          }).catch(err => showToast("Sync step failed", true));
          break;
        }
      }
    }

    // Navigation
    function navigateToFolder(fId) {
      state.currentFolder = fId;
      renderAll();
    }

    // LONG PRESS & CONTEXT MENU ENGINE
    function attachLongPress(element, type, item, parentJob = null) {
      let timer = null;
      let isLongPress = false;

      const start = (e) => {
        isLongPress = false;
        element.dataset.longPressed = 'false';
        timer = setTimeout(() => {
          isLongPress = true;
          element.dataset.longPressed = 'true';
          try { tg?.HapticFeedback?.impactOccurred('medium'); } catch(e) {}
          openContextMenu(type, item, parentJob);
        }, 500);
      };

      const clear = () => {
        clearTimeout(timer);
      };

      element.addEventListener('touchstart', start, { passive: true });
      element.addEventListener('touchend', clear);
      element.addEventListener('touchmove', clear);

      // Desktop Right Click Support
      element.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openContextMenu(type, item, parentJob);
      });
    }

    function openContextMenu(type, item, parentJob) {
      state.contextTarget = { type, item, parentJob };
      const titleEl = document.getElementById('context-menu-title');
      const name = item.name || item.title || 'Item';
      titleEl.innerText = `${type.toUpperCase()}: ${name}`;
      openModal('modal-context');
    }

    function triggerContextAction(action) {
      const target = state.contextTarget;
      closeModal('modal-context');
      if (!target) return;

      if (action === 'edit') {
        if (target.type === 'folder') {
          openFolderModal(target.item);
        } else if (target.type === 'job') {
          openJobModal(target.item);
        } else if (target.type === 'step') {
          openStepEditModal(target.item);
        }
      } else if (action === 'location') {
        switchTab('tree');
        if (target.type === 'folder') {
          navigateToFolder(target.item.parentId || 'root');
        } else if (target.type === 'job') {
          navigateToFolder(target.item.folderId || 'root');
        } else if (target.type === 'step' && target.parentJob) {
          navigateToFolder(target.parentJob.folderId || 'root');
        }
      } else if (action === 'duplicate') {
        duplicateItem(target);
      } else if (action === 'delete') {
        deleteTargetItem(target);
      }
    }

    async function duplicateItem(target) {
      if (target.type === 'job') {
        const original = target.item;
        const newJob = {
          id: `JOB-${Date.now()}`,
          title: `${original.title} (Copy)`,
          folderId: original.folderId,
          isArchived: false,
          steps: original.steps.map((s, idx) => ({
            ...s,
            id: `STP-${Date.now()}-${idx}`,
            status: 'Not Started'
          }))
        };
        state.jobs.push(newJob);
        renderAll();
        showToast("Job Duplicated");
        fetch(`${API_URL}/api/jobcards`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
          body: JSON.stringify(newJob)
        }).catch(()=>{});
      } else {
        showToast("Duplicate supported on Job Cards.");
      }
    }

    async function deleteTargetItem(target) {
      if (!confirm(`Delete this ${target.type} permanently?`)) return;

      const { type, item } = target;
      if (type === 'folder') {
        state.folders = state.folders.filter(f => f.id !== item.id);
      } else if (type === 'job') {
        state.jobs = state.jobs.filter(j => j.id !== item.id);
      } else if (type === 'step') {
        state.jobs.forEach(j => {
          j.steps = j.steps.filter(s => s.id !== item.id);
        });
      }

      renderAll();
      showToast("Item Deleted");

      fetch(`${API_URL}/api/delete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
        body: JSON.stringify({ type, ids: [item.id] })
      }).catch(err => showToast("Backend delete failed", true));
    }

    function archiveJob(jobId) {
      const j = state.jobs.find(job => job.id === jobId);
      if (j) {
        j.isArchived = true;
        renderAll();
        showToast("Job Archived");
        fetch(`${API_URL}/api/archive`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
          body: JSON.stringify({ jobId, isArchived: true })
        }).catch(()=>{});
      }
    }

    function unarchiveJob(jobId) {
      const j = state.jobs.find(job => job.id === jobId);
      if (j) {
        j.isArchived = false;
        renderAll();
        showToast("Job Restored");
        fetch(`${API_URL}/api/archive`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
          body: JSON.stringify({ jobId, isArchived: false })
        }).catch(()=>{});
      }
    }

    // Modal Control Helpers
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // Filter Modal Setup
    function openFilterModal() {
      const fs = document.getElementById('filter-folder-select');
      fs.innerHTML = `<option value="ALL">All System Folders</option>` +
        state.folders.filter(f => f.id !== 'root').map(f => `<option value="${f.id}" ${state.filterFolder === f.id ? 'selected' : ''}>${f.name}</option>`).join('');

      document.getElementById('filter-sort-select').value = state.filterSort;
      document.getElementById('filter-status-select').value = state.filterStatus;
      openModal('modal-filter');
    }

    function applyAdvancedFilters() {
      state.filterSort = document.getElementById('filter-sort-select').value;
      state.filterStatus = document.getElementById('filter-status-select').value;
      state.filterFolder = document.getElementById('filter-folder-select').value;
      closeModal('modal-filter');
      renderAll();
      showToast("Filters applied");
    }

    function resetAdvancedFilters() {
      state.filterSort = 'default';
      state.filterStatus = 'ALL';
      state.filterFolder = 'ALL';
      document.getElementById('filter-sort-select').value = 'default';
      document.getElementById('filter-status-select').value = 'ALL';
      document.getElementById('filter-folder-select').value = 'ALL';
      closeModal('modal-filter');
      renderAll();
      showToast("Filters reset");
    }

    // Folder Modal Logic
    function openFolderModal(existingFolder = null) {
      document.getElementById('folder-edit-id').value = existingFolder ? existingFolder.id : '';
      document.getElementById('folder-name-input').value = existingFolder ? existingFolder.name : '';
      document.getElementById('folder-modal-title').innerText = existingFolder ? 'Edit Folder' : 'New Folder';
      openModal('modal-folder');
    }

    function saveFolder(e) {
      e.preventDefault();
      const id = document.getElementById('folder-edit-id').value;
      const name = document.getElementById('folder-name-input').value.trim();
      if (!name) return;

      if (id) {
        const f = state.folders.find(x => x.id === id);
        if (f) f.name = name;
      } else {
        const newFolder = { id: `FLD-${Date.now()}`, name, parentId: state.currentFolder };
        state.folders.push(newFolder);
      }

      closeModal('modal-folder');
      renderAll();
      showToast("Folder Saved");

      fetch(`${API_URL}/api/folders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
        body: JSON.stringify({ id: id || undefined, name, parentId: state.currentFolder })
      }).catch(()=>{});
    }

    // Job Card Modal Logic
    function openJobModal(existingJob = null) {
      const fs = document.getElementById('job-folder-select');
      fs.innerHTML = state.folders.map(f => `<option value="${f.id}" ${f.id === (existingJob ? existingJob.folderId : state.currentFolder) ? 'selected' : ''}>${f.name}</option>`).join('');

      document.getElementById('job-edit-id').value = existingJob ? existingJob.id : '';
      document.getElementById('job-title-input').value = existingJob ? existingJob.title : '';
      document.getElementById('job-modal-title').innerText = existingJob ? 'Edit Job Card' : 'Job Card Builder';

      if (existingJob) {
        state.builderSteps = JSON.parse(JSON.stringify(existingJob.steps));
      } else {
        state.builderSteps = [{ id: '', title: '', assignee: 'UNASSIGNED', status: 'Not Started', date: '' }];
      }

      renderBuilderSteps();
      openModal('modal-job');
    }

    function addBuilderStep() {
      state.builderSteps.push({ id: '', title: '', assignee: 'UNASSIGNED', status: 'Not Started', date: '' });
      renderBuilderSteps();
    }

    function renderBuilderSteps() {
      const c = document.getElementById('builder-steps-container');
      c.innerHTML = state.builderSteps.map((s, idx) => `
        <div class="step-card" style="margin-bottom:8px;">
          <input type="text" class="form-input" placeholder="Operation Title" value="${s.title}" oninput="state.builderSteps[${idx}].title=this.value" required />
          <div style="display:flex; gap:6px;">
            <select class="form-select" onchange="state.builderSteps[${idx}].assignee=this.value">
              <option value="UNASSIGNED" ${s.assignee==='UNASSIGNED'?'selected':''}>UNASSIGNED</option>
              <option value="JEEVAN" ${s.assignee==='JEEVAN'?'selected':''}>JEEVAN</option>
              <option value="RAVI KUMAR" ${s.assignee==='RAVI KUMAR'?'selected':''}>RAVI KUMAR</option>
              <option value="SANANTH" ${s.assignee==='SANANTH'?'selected':''}>SANANTH</option>
            </select>
            <input type="date" class="form-input" value="${s.date}" onchange="state.builderSteps[${idx}].date=this.value" />
          </div>
        </div>
      `).join('');
    }

    function saveJobCard(e) {
      e.preventDefault();
      const id = document.getElementById('job-edit-id').value;
      const title = document.getElementById('job-title-input').value.trim();
      const folderId = document.getElementById('job-folder-select').value;

      const jobPayload = {
        id: id || `JOB-${Date.now()}`,
        title,
        folderId,
        isArchived: false,
        steps: state.builderSteps.map((s, i) => ({
          ...s,
          id: s.id || `STP-${Date.now()}-${i}`
        }))
      };

      if (id) {
        const idx = state.jobs.findIndex(x => x.id === id);
        if (idx !== -1) state.jobs[idx] = jobPayload;
      } else {
        state.jobs.push(jobPayload);
      }

      closeModal('modal-job');
      renderAll();
      showToast("Job Card Saved");

      fetch(`${API_URL}/api/jobcards`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
        body: JSON.stringify(jobPayload)
      }).catch(()=>{});
    }

    // Step Edit Modal
    function openStepEditModal(step) {
      document.getElementById('step-edit-id').value = step.id;
      document.getElementById('step-edit-title').value = step.title;
      document.getElementById('step-edit-assignee').value = step.assignee;
      document.getElementById('step-edit-status').value = step.status;
      document.getElementById('step-edit-date').value = step.date || '';
      document.getElementById('step-edit-notes').value = step.notes || '';
      openModal('modal-step-edit');
    }

    function saveStepEdit(e) {
      e.preventDefault();
      const id = document.getElementById('step-edit-id').value;
      const title = document.getElementById('step-edit-title').value.trim();
      const assignee = document.getElementById('step-edit-assignee').value;
      const status = document.getElementById('step-edit-status').value;
      const date = document.getElementById('step-edit-date').value;
      const notes = document.getElementById('step-edit-notes').value.trim();

      for (const j of state.jobs) {
        const s = j.steps.find(st => st.id === id);
        if (s) {
          s.title = title;
          s.assignee = assignee;
          s.status = status;
          s.date = date;
          s.notes = notes;
          break;
        }
      }

      closeModal('modal-step-edit');
      renderAll();
      showToast("Operation Updated");

      fetch(`${API_URL}/api/steps`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
        body: JSON.stringify({ stepId: id, title, assignee, status, date, notes })
      }).catch(()=>{});
    }

    // Category Creation
    function openCategoryModal() {
      document.getElementById('category-name-input').value = '';
      openModal('modal-category');
    }

    function saveCategory(e) {
      e.preventDefault();
      const name = document.getElementById('category-name-input').value.trim();
      if (!name) return;
      state.categories.push({ id: `CAT-${Date.now()}`, name });
      closeModal('modal-category');
      renderOthers();
      showToast("Category Added");
    }
  </script>
</body>
</html>
