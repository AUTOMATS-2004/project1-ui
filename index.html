frontend_code_draft = """<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --bg-dark: #131314;
      --card-bg: #1e1f20;
      --card-hover: #28292a;
      --border-subtle: #2d2e31;
      --border-light: #444746;
      --accent-blue: #a8c7fa;
      --accent-blue-bg: rgba(168,199,250,0.15);
      --accent-teal: #78d9ec;
      --accent-teal-bg: rgba(120,217,236,0.15);
      --accent-green: #6dd58c;
      --accent-green-bg: rgba(109,213,140,0.15);
      --accent-amber: #fdd663;
      --accent-amber-bg: rgba(253,214,99,0.15);
      --accent-red: #f28b82;
      --accent-red-bg: rgba(242,139,130,0.15);
      --accent-purple: #d3bbff;
      --accent-purple-bg: rgba(211,187,255,0.15);
      --text-primary: #e3e3e3;
      --text-muted: #8e918f;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    /* Telegram Native App Header Space: 85px padding at top so UI sits below native Telegram controls */
    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-main);
      min-height: 100vh;
      padding-top: 85px;
      padding-bottom: 90px;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Fixed/Sticky Top Navigation Bars */
    .top-nav-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 900;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-subtle);
      padding-top: env(safe-area-inset-top, 0px);
    }
    
    .search-bar-container {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--bg-dark);
    }
    
    .search-input-box {
      flex: 1;
      margin-bottom: 0 !important;
      height: 42px;
      border-radius: 10px;
    }
    
    .nav-primary {
      display: flex;
      background: var(--bg-dark);
      border-top: 1px solid var(--border-subtle);
    }
    
    .primary-tab {
      flex: 1;
      padding: 12px 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    .primary-tab.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
      background: rgba(168,199,250,0.05);
    }
    
    .sub-row {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      background: var(--card-bg);
      overflow-x: auto;
      scrollbar-width: none;
      border-top: 1px solid var(--border-subtle);
    }
    .sub-row::-webkit-scrollbar { display: none; }
    
    .chip-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 20px;
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .chip-btn:active { transform: scale(0.96); }
    .chip-btn.active {
      background: var(--accent-blue-bg);
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    /* Main View Container */
    .view-content {
      padding: 14px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      display: none;
    }
    .view-content.active { display: block; }
    
    /* Breadcrumb trail */
    .breadcrumb-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      padding: 8px 12px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      font-size: 12px;
    }
    .breadcrumb-item {
      color: var(--accent-blue);
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .breadcrumb-separator { color: var(--text-muted); font-size: 11px; }

    /* Cards */
    .folder-item, .job-card-item {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .folder-item:hover, .job-card-item:hover { border-color: var(--border-light); }
    
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .job-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      padding-right: 10px;
    }
    .item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .folder-head-badge {
      font-size: 10px;
      color: var(--accent-teal);
      background: var(--accent-teal-bg);
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }
    .counter-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-blue);
      background: var(--accent-blue-bg);
      padding: 2px 7px;
      border-radius: 10px;
      font-family: var(--font-mono);
    }
    .toggle-arrow {
      color: var(--accent-blue);
      font-weight: bold;
      font-size: 14px;
      padding: 4px 8px;
      cursor: pointer;
    }

    /* Operation Steps */
    .step-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .step-list.collapsed { display: none; }
    
    .step-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px;
      transition: border-color 0.2s;
    }
    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }
    .step-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
    }

    /* Status Pills */
    .badge-status {
      font-size: 10px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.3px;
      white-space: nowrap;
      transition: transform 0.15s;
    }
    .badge-status:active { transform: scale(0.94); }
    .status-notstarted { background: #262729; color: #a8aaad; border: 1px solid #444746; }
    .status-inprogress { background: var(--accent-purple-bg); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
    .status-inhold { background: var(--accent-amber-bg); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
    .status-completed { background: var(--accent-green-bg); color: var(--accent-green); border: 1px solid var(--accent-green); }

    .step-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .meta-notes {
      margin-top: 6px;
      font-size: 11px;
      color: #b0b4b8;
      background: rgba(255,255,255,0.03);
      padding: 6px 8px;
      border-radius: 6px;
      border-left: 2px solid var(--accent-blue);
      white-space: pre-wrap;
    }

    /* Overdue badge */
    .badge-overdue {
      font-size: 9px;
      font-weight: 800;
      background: var(--accent-red-bg);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: #000;
      border: none;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      z-index: 800;
      box-shadow: 0 4px 18px rgba(168,199,250,0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.92); }

    /* Modals & Bottom Drawers */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(3px);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-drawer {
      background: var(--card-bg);
      border-top: 1px solid var(--border-light);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 800px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 20px 18px 30px;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -8px 30px rgba(0,0,0,0.7);
    }
    .modal-overlay.active .modal-drawer { transform: translateY(0); }
    .drawer-handle {
      width: 36px;
      height: 4px;
      background: var(--border-light);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    
    .modal-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* STRICT FORM INPUT CONSTRAINT:
       All select, input, textarea MUST have background: #ffffff, color: #000000 */
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    select.form-select,
    input.form-input,
    textarea.form-textarea {
      width: 100%;
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 600 !important;
      border: 2px solid var(--accent-blue) !important;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
      box-shadow: none;
      -webkit-appearance: none;
      font-family: var(--font-main);
    }
    input.form-input::placeholder,
    textarea.form-textarea::placeholder {
      color: #666666 !important;
      font-weight: 500;
    }
    select.form-select option {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 600 !important;
    }

    .btn-action {
      width: 100%;
      background: var(--accent-blue);
      color: #000000;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.15s;
    }
    .btn-action:active { background: #89b4f8; }
    
    .btn-archive {
      width: 100%;
      background: var(--accent-green);
      color: #000000;
      border: none;
      font-weight: 700;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-cancel {
      width: 100%;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      font-weight: 600;
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Context Menu Actions */
    .context-menu-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    .context-btn {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    .context-btn:active { background: var(--card-hover); }
    .context-btn-delete {
      color: var(--accent-red) !important;
      border-color: rgba(242,139,130,0.3) !important;
      background: var(--accent-red-bg) !important;

    /* Step builder card */
    .builder-step-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    /* Loader Overlay */
    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(19,19,20,0.85);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .loader-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .gemini-spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--accent-blue);
      border-right-color: var(--accent-purple);
      border-bottom-color: var(--accent-green);
      animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Global Fullscreen Sync Loader -->
  <div class="loader-overlay" id="global-loader">
    <div class="gemini-spinner"></div>
    <div style="font-family:var(--font-mono); color:var(--text-primary); font-size:13px; font-weight:600; letter-spacing:0.5px;">SYNCING WITH MATRIX...</div>
  </div>

  <!-- Top Sticky Navigation Bar -->
  <div class="top-nav-wrapper">
    <div class="search-bar-container">
      <input type="text" id="global-search-input" class="form-input search-input-box" placeholder="🔍 Search Specs, Jobs, Folders..." oninput="renderAll()" />
      <button class="chip-btn" onclick="openFilterModal()">⚙️ Filters</button>
    </div>

    <nav class="nav-primary">
      <button class="primary-tab active" id="tab-btn-tree" onclick="switchTab('tree')">TREE</button>
      <button class="primary-tab" id="tab-btn-schedule" onclick="switchTab('schedule')">SCHEDULE</button>
      <button class="primary-tab" id="tab-btn-others" onclick="switchTab('others')">OTHERS</button>
    </nav>

    <!-- Contextual Sub-Nav: SCHEDULE Tab (TODAY | DEADLINE | QUEUE) -->
    <div class="sub-row" id="schedule-sub-nav" style="display:none;">
      <button class="chip-btn active" id="sub-today-btn" onclick="setSubTab('today')">TODAY</button>
      <button class="chip-btn" id="sub-deadline-btn" onclick="setSubTab('deadline')">DEADLINE</button>
      <button class="chip-btn" id="sub-queue-btn" onclick="setSubTab('queue')">QUEUE</button>
    </div>

    <!-- Universal Assignee Filter: ALL | JEEVAN | RAVI KUMAR | SANANTH | UNASSIGNED -->
    <div class="sub-row" id="assignee-filter-bar">
      <button class="chip-btn active" onclick="setAssignee('ALL')">ALL</button>
      <button class="chip-btn" onclick="setAssignee('JEEVAN')">JEEVAN</button>
      <button class="chip-btn" onclick="setAssignee('RAVI KUMAR')">RAVI KUMAR</button>
      <button class="chip-btn" onclick="setAssignee('SANANTH')">SANANTH</button>
      <button class="chip-btn" onclick="setAssignee('UNASSIGNED')">UNASSIGNED</button>
    </div>
  </div>

  <!-- Main Views -->
  <main>
    <!-- View 1: TREE -->
    <div id="page-tree" class="view-content active">
      <div id="breadcrumb-container" class="breadcrumb-bar"></div>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="chip-btn" onclick="openNewFolderModal()">+ New Folder</button>
        <button class="chip-btn" onclick="openJobModal()">+ New Job Card</button>
      </div>
      <div id="tree-container"></div>
    </div>

    <!-- View 2: SCHEDULE -->
    <div id="page-schedule" class="view-content">
      <div id="schedule-active-container"></div>
      <div style="margin-top:24px; border-top:1px solid var(--border-subtle); padding-top:14px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h3 style="font-size:13px; font-weight:700; color:var(--accent-green); text-transform:uppercase; letter-spacing:0.5px;">✅ Completed Operations</h3>
          <span id="completed-count-badge" class="counter-badge">0</span>
        </div>
        <div id="schedule-completed-container"></div>
      </div>
    </div>

    <!-- View 3: OTHERS -->
    <div id="page-others" class="view-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <span style="font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Custom Categories</span>
        <button class="chip-btn" onclick="openAddCategoryModal()">+ Add Category</button>
      </div>
      <div id="others-container"></div>
      
      <!-- Static Completed Archive Section -->
      <div class="folder-item" style="margin-top:24px; border-color:rgba(109,213,140,0.4);" onclick="openCompletedArchiveModal()">
        <div class="item-header">
          <div class="job-title-group">
            <span class="item-title" style="color:var(--accent-green);">📦 COMPLETED ARCHIVE</span>
            <span style="font-size:11px; color:var(--text-muted);">View and restore archived shop floor job cards</span>
          </div>
          <span style="font-size:14px; color:var(--accent-green);">➔</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Floating Action Button -->
  <button class="fab" onclick="openJobModal()" title="New Job Card">+</button>

  <!-- MODAL 1: Job Card Builder Drawer -->
  <div class="modal-overlay" id="modal-job">
    <div class="modal-drawer">
      <div class="drawer-handle"></div>
      <div class="modal-header-row">
        <h3 class="modal-title" id="job-modal-title">Job Card Builder</h3>
        <button class="chip-btn" onclick="closeAllModals()">✕</button>
      </div>
      <form id="job-form" onsubmit="saveJobCard(event)">
        <label class="form-label">Job Title *</label>
        <input type="text" id="job-title" class="form-input" placeholder="e.g., Worm Gear Batch #42" required />
        
        <label class="form-label">Destination Folder</label>
        <select id="job-folder" class="form-select"></select>

        <label class="form-label">Folder Head Identifier (Tag)</label>
        <select id="job-head" class="form-select"></select>

        <div style="display:flex; justify-content:space-between; align-items:center; margin: 16px 0 8px;">
          <label class="form-label" style="margin-bottom:0;">Operations & Steps</label>
          <button type="button" class="chip-btn" onclick="addBuilderStep()">+ Add Operation</button>
        </div>
        
        <div id="job-steps-container"></div>

        <button type="submit" class="btn-action">Save to Matrix</button>
        <button type="button" class="btn-cancel" onclick="closeAllModals()">Cancel</button>
      </form>
    </div>
  </div>

  <!-- MODAL 2: Filter & Sort Drawer -->
  <div class="modal-overlay" id="modal-filter">
    <div class="modal-drawer">
      <div class="drawer-handle"></div>
      <div class="modal-header-row">
        <h3 class="modal-title">Filter & Sort Scope</h3>
        <button class="chip-btn" onclick="closeAllModals()">✕</button>
      </div>
      <div>
        <label class="form-label">Sort By</label>
        <select id="filter-sort-by" class="form-select">
          <option value="title">Title (Alphabetical)</option>
          <option value="deadline">Deadline Date</option>
          <option value="created">Creation Date</option>
        </select>

        <label class="form-label">Sort Order</label>
        <select id="filter-sort-order" class="form-select">
          <option value="asc">Ascending (A-Z / Earliest)</option>
          <option value="desc">Descending (Z-A / Latest)</option>
        </select>

        <label class="form-label">Folder Scope</label>
        <select id="filter-folder-scope" class="form-select">
          <option value="all">All Folders (Universal Scope)</option>
        </select>

        <button type="button" class="btn-action" onclick="applyFilterModal()">Apply Filters</button>
        <button type="button" class="btn-cancel" onclick="resetFilterModal()">Reset to Defaults</button>
      </div>
    </div>
  </div>

  <!-- MODAL 3: Long-Press Context Menu Drawer -->
  <div class="modal-overlay" id="modal-context">
    <div class="modal-drawer">
      <div class="drawer-handle"></div>
      <div class="modal-header-row">
        <div class="job-title-group">
          <h3 class="modal-title" id="context-item-title">Item Title</h3>
          <span style="font-size:11px; color:var(--text-muted); font-family:var(--font-mono);" id="context-item-type">FOLDER</span>
        </div>
        <button class="chip-btn" onclick="closeAllModals()">✕</button>
      </div>
      <div class="context-menu-list">
        <button class="context-btn" onclick="contextActionEdit()">
          <span>✏️</span> <span>Edit Full / View Details</span>
        </button>
        <button class="context-btn" onclick="contextActionOpenLocation()">
          <span>📁</span> <span>Open Folder Location</span>
        </button>
        <button class="context-btn" onclick="contextActionDuplicate()">
          <span>📋</span> <span>Duplicate</span>
        </button>
        <button class="context-btn context-btn-delete" onclick="contextActionDelete()">
          <span>🗑️</span> <span>Delete Permanently</span>
        </button>
      </div>
    </div>
  </div>
