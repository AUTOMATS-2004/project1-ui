<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini Task Matrix</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #131314;
      --card-bg: #1e1f20;
      --card-hover: #28292a;
      --border-subtle: #2d2e31;
      --border-accent: #3e4043;

      --accent-blue: #a8c7fa;
      --accent-blue-bg: rgba(168, 199, 250, 0.12);
      --accent-purple: #d0bcff;
      --accent-purple-bg: rgba(208, 188, 255, 0.12);
      --accent-teal: #78d9ec;
      --accent-teal-bg: rgba(120, 217, 236, 0.12);
      --accent-amber: #fdd663;
      --accent-amber-bg: rgba(253, 214, 99, 0.12);
      --accent-green: #6dd58c;
      --accent-green-bg: rgba(109, 213, 140, 0.12);
      --accent-red: #f28b82;

      --text-primary: #e3e3e3;
      --text-secondary: #c4c7c5;
      --text-muted: #8e918f;

      --font-main: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-primary); font-family: var(--font-main); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 80px; }

    header { padding: 14px 18px; background: var(--bg-dark); border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .gemini-spark { width: 14px; height: 14px; background: linear-gradient(135deg, #7c4dff, #448aff, #00e5ff); border-radius: 4px; box-shadow: 0 0 12px rgba(124, 77, 255, 0.5); }
    .header-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .user-pill { font-size: 11px; font-weight: 500; color: var(--accent-blue); background: var(--accent-blue-bg); border: 1px solid rgba(168, 199, 250, 0.25); padding: 4px 10px; border-radius: 20px; }

    .search-bar-container { padding: 10px 18px; background: var(--bg-dark); border-bottom: 1px solid var(--border-subtle); display: flex; gap: 8px; position: sticky; top: 51px; z-index: 950; }

    .nav-primary { display: flex; align-items: center; background: var(--bg-dark); border-bottom: 1px solid var(--border-subtle); padding: 4px 12px; position: sticky; top: 101px; z-index: 900; }
    .primary-tab { flex: 1; padding: 12px 0; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; text-transform: uppercase; text-align: center; }
    .primary-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }

    .sub-nav-container { background: var(--card-bg); border-bottom: 1px solid var(--border-subtle); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    .sub-nav-container.collapsed { display: none; }
    .sub-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .sub-row::-webkit-scrollbar { display: none; }

    .chip-btn { font-size: 11px; font-weight: 500; padding: 6px 14px; border-radius: 20px; background: var(--bg-dark); border: 1px solid var(--border-subtle); color: var(--text-secondary); white-space: nowrap; cursor: pointer; }
    .chip-btn.active { background: var(--accent-blue-bg); color: var(--accent-blue); border-color: var(--accent-blue); font-weight: 600; }
    .btn-back { background: var(--card-hover); color: var(--accent-teal); border: 1px solid var(--accent-teal); font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 6px; }

    .toggle-subnav-btn { background: transparent; border: none; color: var(--text-muted); font-size: 12px; padding: 0 8px; cursor: pointer; }

    .view-content { padding: 16px; max-width: 800px; margin: 0 auto; width: 100%; }
    .tab-page { display: none; }
    .tab-page.active { display: block; }

    .tree-breadcrumbs { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-bottom: 14px; overflow-x: auto; }
    .breadcrumb-item { color: var(--accent-teal); cursor: pointer; }

    .folder-item, .job-card-item { background: var(--card-bg); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; position: relative; user-select: none; }
    .folder-header, .job-header { display: flex; justify-content: space-between; align-items: center; }
    .folder-title-group, .job-title-group { display: flex; align-items: center; gap: 10px; }
    .item-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }

    .progress-container { margin-top: 10px; }
    .progress-info { display: flex; justify-style: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-family: var(--font-mono); }
    .progress-track { height: 6px; width: 100%; background: var(--bg-dark); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-teal)); border-radius: 3px; }

    .step-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .step-card { background: var(--bg-dark); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 12px; position: relative; }
    .step-header { display: flex; justify-style: space-between; align-items: flex-start; margin-bottom: 6px; }
    .step-title { font-size: 13px; font-weight: 500; color: var(--text-primary); }

    .badge-status { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 12px; text-transform: uppercase; cursor: pointer; }
    .status-notstarted { background: rgba(142, 145, 143, 0.15); color: var(--text-muted); border: 1px solid var(--text-muted); }
    .status-inprogress { background: var(--accent-purple-bg); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
    .status-inhold { background: var(--accent-amber-bg); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
    .status-completed { background: var(--accent-green-bg); color: var(--accent-green); border: 1px solid var(--accent-green); }

    .step-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    .meta-pill { background: var(--card-bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-subtle); }
    .meta-assignee { color: var(--accent-teal); font-family: var(--font-mono); }

    .fab { position: fixed; bottom: 24px; right: 20px; width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: #000; border: none; box-shadow: 0 4px 20px rgba(168, 199, 250, 0.3); font-size: 26px; font-weight: bold; cursor: pointer; z-index: 500; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); z-index: 2000; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-drawer { background: var(--card-bg); border-top: 1px solid var(--border-accent); border-radius: 20px 20px 0 0; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 20px; transform: translateY(100%); transition: transform 0.25s ease; }
    .modal-overlay.active .modal-drawer { transform: translateY(0); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; }
    .modal-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    
    /* MANDATORY WHITE BACKGROUND WITH BLACK TEXT FOR ALL SELECTS & INPUTS */
    select.form-select, input.form-input, textarea.form-textarea {
      width: 100%;
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 600 !important;
      border: 1px solid var(--border-accent) !important;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
    }

    select.form-select option {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 600 !important;
    }

    .btn-action { width: 100%; background: linear-gradient(135deg, var(--accent-blue), #7c4dff); color: #000; border: none; font-weight: 600; font-size: 13px; padding: 12px; border-radius: var(--radius-sm); cursor: pointer; margin-top: 10px; }

    .builder-step-card { background: var(--bg-dark); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }

    .context-menu-option { padding: 14px; border-bottom: 1px solid var(--border-subtle); font-size: 14px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .picker-item { padding: 12px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; font-size: 13px; }
    .picker-item:hover { background: var(--card-hover); }
  </style>
</head>
<body>

  <header>
    <div class="header-brand">
      <div class="gemini-spark"></div>
      <div class="header-title">Matrix Operations</div>
    </div>
    <div class="user-pill" id="user-pill">👤 RAVI KUMAR</div>
  </header>

  <!-- Universal Deep Search Bar -->
  <div class="search-bar-container">
    <input type="text" id="global-search-input" class="form-input" placeholder="🔍 Search Folders, Jobs, Steps, Specs, Notes, Assignees..." oninput="handleUniversalSearch()" />
    <button class="chip-btn" onclick="openFilterSortModal()">⚙️ Filters</button>
  </div>

  <nav class="nav-primary">
    <button class="primary-tab active" onclick="switchPrimaryTab('tree')">TREE</button>
    <button class="primary-tab" onclick="switchPrimaryTab('schedule')">SCHEDULE</button>
    <button class="primary-tab" onclick="switchPrimaryTab('others')">OTHERS</button>
    <button class="toggle-subnav-btn" onclick="toggleSubNav()" id="subnav-toggle-icon">▲</button>
  </nav>

  <div class="sub-nav-container" id="sub-nav-container">
    <div class="sub-row" id="sub-row-tabs" style="display:none;">
      <button class="chip-btn active" onclick="setSubTab('today')">TODAY</button>
      <button class="chip-btn" onclick="setSubTab('deadline')">DEADLINE</button>
      <button class="chip-btn" onclick="setSubTab('queue')">QUEUE</button>
    </div>
    <div class="sub-row" id="sub-row-filters">
      <button class="chip-btn active" onclick="setAssigneeFilter('ALL')">ALL</button>
      <button class="chip-btn" onclick="setAssigneeFilter('JEEVAN')">JEEVAN</button>
      <button class="chip-btn" onclick="setAssigneeFilter('RAVI KUMAR')">RAVI KUMAR</button>
      <button class="chip-btn" onclick="setAssigneeFilter('SANANTH')">SANANTH</button>
      <button class="chip-btn" onclick="setAssigneeFilter('UNASSIGNED')">UNASSIGNED</button>
    </div>
  </div>

  <main class="view-content">

    <!-- View Page 1: TREE -->
    <div id="page-tree" class="tab-page active">
      <div id="tree-nav-controls"></div>
      <div class="tree-breadcrumbs" id="tree-breadcrumbs">
        <span class="breadcrumb-item" onclick="navToFolder('root')">📁 Root</span>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="chip-btn" onclick="openAddFolderModal()">+ New Folder</button>
        <button class="chip-btn" onclick="openAddJobCardModal()">+ New Job Card</button>
      </div>
      <div id="tree-items-container"></div>
    </div>

    <!-- View Page 2: SCHEDULE -->
    <div id="page-schedule" class="tab-page">
      <div id="schedule-items-container"></div>
    </div>

    <!-- View Page 3: OTHERS (Folder Drill-Down View) -->
    <div id="page-others" class="tab-page">
      <div id="others-category-controls"></div>
      <div id="others-items-container"></div>
    </div>

  </main>

  <button class="fab" onclick="openAddJobCardModal()">+</button>

  <!-- Context Menu Drawer -->
  <div class="modal-overlay" id="modal-context-menu">
    <div class="modal-drawer" style="padding:10px;">
      <div style="text-align:center; padding:8px; font-size:12px; color:var(--text-muted);" id="context-item-title">Item Options</div>
      <div class="context-menu-option" onclick="handleContextAction('edit')">✏️ Edit Full / View Details</div>
      <div class="context-menu-option" onclick="handleContextAction('copy')">📋 Copy / Duplicate</div>
      <div class="context-menu-option" style="color:var(--accent-red);" onclick="handleContextAction('delete')">🗑️ Delete Permanently</div>
      <button class="btn-action" style="background:var(--bg-dark); color:var(--text-muted); margin-top:10px;" onclick="closeModal('modal-context-menu')">Cancel</button>
    </div>
  </div>

  <!-- Searchable Picker Modal for OTHERS Categories -->
  <div class="modal-overlay" id="modal-category-picker">
    <div class="modal-drawer">
      <div class="modal-header">
        <div class="modal-title" id="category-picker-title">Add Operation to Category</div>
        <button class="close-btn" onclick="closeModal('modal-category-picker')">&times;</button>
      </div>
      <input type="text" id="category-search-input" class="form-input" placeholder="Type to search Operation Step or Job..." oninput="renderCategoryPickerList()" />
      <div id="category-picker-results" style="max-height:300px; overflow-y:auto; margin-top:10px;"></div>
    </div>
  </div>

  <!-- Filter & Sort Options Modal -->
  <div class="modal-overlay" id="modal-filter-sort">
    <div class="modal-drawer">
      <div class="modal-header">
        <div class="modal-title">⚙️ Filter & Sort Options</div>
        <button class="close-btn" onclick="closeModal('modal-filter-sort')">&times;</button>
      </div>
      <div class="form-group">
        <label class="form-label">Sort Order</label>
        <select id="filter-sort-order" class="form-select" onchange="renderAll()">
          <option value="TITLE_ASC">Title (A-Z) [Ascending]</option>
          <option value="TITLE_DESC">Title (Z-A) [Descending]</option>
          <option value="DATE_ASC">Date Ascending (Earliest First)</option>
          <option value="DATE_DESC">Date Descending (Latest First)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Folder Scope</label>
        <select id="filter-folder-scope" class="form-select" onchange="renderAll()">
          <option value="ALL">Entire System (Root & All Subfolders)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Date Range Scope</label>
        <div style="display:flex; gap:8px;">
          <input type="date" id="filter-date-from" class="form-input" onchange="renderAll()" />
          <input type="date" id="filter-date-to" class="form-input" onchange="renderAll()" />
        </div>
      </div>
      <button class="btn-action" onclick="closeModal('modal-filter-sort')">Apply Filters</button>
    </div>
  </div>

  <!-- Modal: Folder Creator / Editor -->
  <div class="modal-overlay" id="modal-folder">
    <div class="modal-drawer">
      <div class="modal-header">
        <div class="modal-title" id="modal-folder-title-header">New Folder</div>
        <button class="close-btn" onclick="closeModal('modal-folder')">&times;</button>
      </div>
      <form onsubmit="saveFolder(event)">
        <div class="form-group">
          <label class="form-label">Folder Name</label>
          <input type="text" id="input-folder-name" class="form-input" placeholder="e.g. Worm Gears" required />
        </div>
        <button type="submit" class="btn-action">Save Folder</button>
      </form>
    </div>
  </div>

  <!-- Modal: Full Job Card & Process Chart Builder/Editor -->
  <div class="modal-overlay" id="modal-job-editor">
    <div class="modal-drawer">
      <div class="modal-header">
        <div class="modal-title" id="modal-job-title-header">Job Card & Process Chart</div>
        <button class="close-btn" onclick="closeModal('modal-job-editor')">&times;</button>
      </div>
      <form onsubmit="saveJobCard(event)">
        <div class="form-group">
          <label class="form-label">Job Title</label>
          <input type="text" id="input-job-title" class="form-input" placeholder="e.g. Worm Shaft #409" required />
        </div>
        <div class="form-group">
          <label class="form-label">Destination Folder</label>
          <select id="select-job-folder" class="form-select"></select>
        </div>

        <div class="form-group">
          <label class="form-label">Process Chart Operations Sequence</label>
          <div id="steps-builder-list"></div>
          <button type="button" class="chip-btn" style="margin-top:8px;" onclick="addRichStepInput()">+ Add Operation Step</button>
        </div>

        <button type="submit" class="btn-action">Save to Google Sheets</button>
      </form>
    </div>
  </div>

  <!-- Modal: Individual Operation Step Edit Drawer -->
  <div class="modal-overlay" id="modal-step-editor">
    <div class="modal-drawer">
      <div class="modal-header">
        <div class="modal-title" id="modal-step-title-header">Edit Operation Step</div>
        <button class="close-btn" onclick="closeModal('modal-step-editor')">&times;</button>
      </div>
      <form onsubmit="saveIndividualStepEdit(event)">
        <div class="form-group">
          <label class="form-label">Step Title</label>
          <input type="text" id="edit-step-title" class="form-input" required />
        </div>

        <div style="display:flex; gap:8px;">
          <div style="flex:1;" class="form-group">
            <label class="form-label">Assignee</label>
            <select id="edit-step-assignee" class="form-select">
              <option value="UNASSIGNED">UNASSIGNED</option>
              <option value="JEEVAN">JEEVAN</option>
              <option value="RAVI KUMAR">RAVI KUMAR</option>
              <option value="SANANTH">SANANTH</option>
              <option value="ALL">ALL</option>
            </select>
          </div>
          <div style="flex:1;" class="form-group">
            <label class="form-label">Status</label>
            <select id="edit-step-status" class="form-select">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="In Hold">In Hold</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>

        <div style="display:flex; gap:8px;">
          <div style="flex:1;" class="form-group">
            <label class="form-label">Deadline Date</label>
            <input type="date" id="edit-step-date" class="form-input" />
          </div>
          <div style="flex:1;" class="form-group">
            <label class="form-label">Time</label>
            <input type="time" id="edit-step-time" class="form-input" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Manufacturing Specs / Notes</label>
          <textarea id="edit-step-notes" class="form-textarea" rows="2"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Attach File from Device (PDF, Image, Drawing)</label>
          <input type="file" id="edit-step-file-input" class="form-input" style="background:#ffffff !important; color:#000000 !important;" />
          <div id="edit-step-current-attachment" style="font-size:11px; color:var(--accent-blue); margin-top:4px;"></div>
        </div>

        <button type="submit" class="btn-action">Update Operation Step</button>
      </form>
    </div>
  </div>

  <script>
    const WORKER_API_URL = "https://project1-brain.aeijeevan.workers.dev";
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const userBadge = document.getElementById('user-pill');
    if (tg?.initDataUnsafe?.user) {
      userBadge.innerText = `👤 ${tg.initDataUnsafe.user.first_name || tg.initDataUnsafe.user.username}`;
    }

    let currentPrimaryTab = 'tree';
    let currentSubTab = 'today';
    let currentAssigneeFilter = 'ALL';
    let subNavExpanded = true;
    let currentFolderId = 'root';

    let searchQuery = '';
    let activeContextItem = null;
    let editingJobId = null;
    let editingFolderId = null;
    let editingStepId = null;
    let activeTargetCategoryId = null;
    let selectedCategoryDrillDownId = null;

    let folders = [{ id: 'root', name: 'Root', parentId: null }];
    let jobCards = [];
    let builderSteps = [];

    let customOthersCategories = [
      { id: 'cat-overdue', emoji: '🚨', title: 'Overdue Operations' },
      { id: 'cat-urgent', emoji: '⭐', title: 'Urgent Priority' },
      { id: 'cat-raw', emoji: '🚚', title: 'Raw Material Pending' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      fetchLiveData();
    });

    async function fetchLiveData() {
      const initData = tg?.initData || '';
      const userId = tg?.initDataUnsafe?.user?.id || '8822239844';

      try {
        const res = await fetch(`${WORKER_API_URL}/api/data`, {
          headers: {
            'X-Telegram-Init-Data': initData,
            'X-Telegram-User-Id': String(userId)
          }
        });
        if (!res.ok) {
          const errText = await res.text();
          alert(`Server Fetch Error (${res.status}):\n${errText}`);
          return;
        }
        const data = await res.json();

        if (data.folders) folders = data.folders.length ? data.folders : [{ id: 'root', name: 'Root', parentId: null }];
        if (data.jobCards) jobCards = data.jobCards;

        populateFolderScopeOptions();
        renderAll();
      } catch (err) {
        alert(`Network Exception:\n${err.message}`);
        renderAll();
      }
    }

    function populateFolderScopeOptions() {
      const select = document.getElementById('filter-folder-scope');
      select.innerHTML = '<option value="ALL">Entire System (Root & All Subfolders)</option>';
      folders.forEach(f => {
        select.innerHTML += `<option value="${f.id}">${f.name}</option>`;
      });
    }

    function renderAll() {
      renderTreeFolderContent();
      renderScheduleContent();
      renderOthersContent();
      updateSubNavVisibility();
    }

    function switchPrimaryTab(tab) {
      currentPrimaryTab = tab;
      document.querySelectorAll('.primary-tab').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-page').forEach(page => page.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(`page-${tab}`).classList.add('active');
      updateSubNavVisibility();
    }

    function toggleSubNav() {

    /* Helper: Convert File to Base64 */
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
          const base64String = reader.result.split(',')[1];
          resolve(base64String);
        };
        reader.onerror = error => reject(error);
      });
    }

    /* Helper: Upload File to Google Drive */
    async function uploadSelectedFileToDrive(file, folderPathArray) {
      const base64Data = await fileToBase64(file);
      const initData = tg?.initData || '';
      const userId = tg?.initDataUnsafe?.user?.id || '8822239844';

      const payload = {
        fileName: file.name,
        mimeType: file.type,
        base64Data: base64Data,
        folderPath: folderPathArray
      };

      const res = await fetch(`${WORKER_API_URL}/api/upload-drive-file`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData, 'X-Telegram-User-Id': String(userId) },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        throw new Error(`Drive Upload Server Error (${res.status}): ${await res.text()}`);
      }

      const data = await res.json();
      return data.fileUrl;
    }

    /* ==========================================================================
       LONG-PRESS & CONTEXT MENU ENGINE
       ========================================================================== */
    function attachLongPressListener(element, type, id, title) {
      let timer = null;

      element.addEventListener('touchstart', (e) => {
        timer = setTimeout(() => { openContextMenu(type, id, title); }, 600);
      });

      element.addEventListener('touchend', () => { if (timer) clearTimeout(timer); });
      element.addEventListener('touchmove', () => { if (timer) clearTimeout(timer); });

      element.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openContextMenu(type, id, title);
      });
    }

    function openContextMenu(type, id, title) {
      activeContextItem = { type, id, title };
      document.getElementById('context-item-title').innerText = `${type.toUpperCase()}: ${title}`;
      document.getElementById('modal-context-menu').classList.add('active');
    }

    async function handleContextAction(action) {
      if (!activeContextItem) return;
      closeModal('modal-context-menu');

      if (action === 'delete') {
        if (confirm(`Delete ${activeContextItem.type} "${activeContextItem.title}"?`)) {
          await executeDelete([activeContextItem.id], activeContextItem.type);
        }
      } else if (action === 'edit') {
        if (activeContextItem.type === 'job') {
          openFullEditJobCardModal(activeContextItem.id);
        } else if (activeContextItem.type === 'folder') {
          openFullEditFolderModal(activeContextItem.id);
        } else if (activeContextItem.type === 'step') {
          openFullEditStepModal(activeContextItem.id);
        }
      } else if (action === 'copy') {
        duplicateJobCard(activeContextItem.id);
      }
    }

    /* Filter & Sort Engine Helper Functions */
    function getFilteredAndSortedJobs(inputJobs) {
      const sortOrder = document.getElementById('filter-sort-order')?.value || 'TITLE_ASC';
      const folderScope = document.getElementById('filter-folder-scope')?.value || 'ALL';
      const dateFrom = document.getElementById('filter-date-from')?.value || '';
      const dateTo = document.getElementById('filter-date-to')?.value || '';

      let list = [...inputJobs];

      if (folderScope !== 'ALL') {
        list = list.filter(j => j.folderId === folderScope);
      }

      if (dateFrom || dateTo) {
        list = list.filter(j => j.steps.some(s => {
          if (!s.date) return false;
          if (dateFrom && s.date < dateFrom) return false;
          if (dateTo && s.date > dateTo) return false;
          return true;
        }));
      }

      list.sort((a, b) => {
        if (sortOrder === 'TITLE_ASC') return a.title.localeCompare(b.title);
        if (sortOrder === 'TITLE_DESC') return b.title.localeCompare(a.title);
        return 0;
      });

      return list;
    }

    function renderTreeFolderContent() {
      const container = document.getElementById('tree-items-container');

      // Back Button
      const currentFolder = folders.find(f => f.id === currentFolderId);

        const parentFolder = folders.find(f => f.id === currentFolder.parentId) || { name: 'Root', id: 'root' };
        navControls.innerHTML = `<button class="btn-back" onclick="navToFolder('${parentFolder.id}')">⬅️ Back to ${parentFolder.name}</button>`;
      }

      // Breadcrumbs
      const breadcrumbs = document.getElementById('tree-breadcrumbs');
      breadcrumbs.innerHTML = `<span class="breadcrumb-item" onclick="navToFolder('root')">📁 Root</span>`;
      
      let path = getFolderPath(currentFolderId);
      path.forEach(f => {
        if (f.id !== 'root') breadcrumbs.innerHTML += ` ➔ <span class="breadcrumb-item" onclick="navToFolder('${f.id}')">${f.name}</span>`;
      });

      let subFolders = folders.filter(f => f.parentId === currentFolderId);
      let currentJobs = jobCards.filter(j => j.folderId === currentFolderId);

      // Deep Universal Search Traversal
      if (searchQuery) {
        container.innerHTML += `<div style="font-size:12px; color:var(--accent-teal); margin-bottom:10px;">🔍 Deep Search matching: "${searchQuery}"</div>`;
        
        subFolders = folders.filter(f => f.name.toLowerCase().includes(searchQuery));
        currentJobs = jobCards.filter(job => {
          const titleMatch = job.title.toLowerCase().includes(searchQuery);
          const stepMatch = job.steps.some(s => 
            s.title.toLowerCase().includes(searchQuery) ||
            s.notes.toLowerCase().includes(searchQuery) ||
            s.assignee.toLowerCase().includes(searchQuery) ||
            s.attachmentUrl.toLowerCase().includes(searchQuery)
          );
          return titleMatch || stepMatch;
        });

        if (!subFolders.length && !currentJobs.length) {
          container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--accent-red); font-weight:600;">⚠️ No search results found matching "${searchQuery}"</div>`;
          return;
        }
      }

      currentJobs = getFilteredAndSortedJobs(currentJobs);

      // Render Folders
      subFolders.forEach(folder => {
        const item = document.createElement('div');
        item.className = 'folder-item';

        item.innerHTML = `
          <div class="folder-header">
            <div class="folder-title-group" onclick="navToFolder('${folder.id}')" style="cursor:pointer; flex:1;">
              <span>📁</span>
              <span class="item-title">${folder.name}</span>
            </div>
            <span style="font-size:12px; color:var(--text-muted); cursor:pointer;" onclick="openContextMenu('folder', '${folder.id}', '${folder.name}')">✏️</span>
          </div>`;

        attachLongPressListener(item, 'folder', folder.id, folder.name);
        container.appendChild(item);
      });

      // Render Job Cards
      currentJobs.forEach(job => container.appendChild(createJobCardElement(job)));

      if (!subFolders.length && !currentJobs.length) {
        container.innerHTML += `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">[ Folder Empty ]</div>`;
      }
    }

    function navToFolder(id) { currentFolderId = id; renderTreeFolderContent(); }

    function getFolderPath(folderId) {
      let path = [], current = folders.find(f => f.id === folderId);
      while (current) { path.unshift(current); current = folders.find(f => f.id === current.parentId); }
      return path;
    }

    function createJobCardElement(job) {
      const card = document.createElement('div');
      card.className = 'job-card-item';

      const completed = job.steps.filter(s => s.status === 'Completed').length;
      const total = job.steps.length;
      const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

      card.innerHTML = `
        <div class="job-header">
          <div class="job-title-group">
            <span>⚙️</span>
            <span class="item-title">${job.title}</span>
          </div>
          <span style="font-size:12px; color:var(--text-muted); cursor:pointer;" onclick="openFullEditJobCardModal('${job.id}')">✏️ Edit</span>
        </div>
        <div class="progress-container">
          <div class="progress-info"><span>Progress</span><span>${pct}% (${completed}/${total})</span></div>
          <div class="progress-track"><div class="progress-fill" style="width: ${pct}%;"></div></div>
        </div>
        <div class="step-list">${job.steps.map(s => createStepHTML(s)).join('')}</div>
      `;

      attachLongPressListener(card, 'job', job.id, job.title);
      return card;
    }

    function createStepHTML(step) {
      if (currentAssigneeFilter !== 'ALL' && step.assignee !== currentAssigneeFilter) return '';
      const statusClass = `status-${step.status.toLowerCase().replace(/\s+/g, '')}`;

      return `
        <div class="step-card">
          <div class="step-header">
            <span class="step-title">${step.title}</span>
            <div style="display:flex; gap:6px; align-items:center;">
              <span class="badge-status ${statusClass}" onclick="cycleStepStatusForward('${step.id}')">${step.status}</span>
              <span style="font-size:11px; color:var(--text-muted); cursor:pointer;" onclick="openFullEditStepModal('${step.id}')">✏️</span>
            </div>
          </div>
          <div class="step-meta">
            <span class="meta-pill meta-assignee">👤 ${step.assignee || 'UNASSIGNED'}</span>
            ${step.date ? `<span class="meta-pill">📅 ${step.date} ${step.time || ''}</span>` : ''}
            ${step.attachmentUrl ? `<a href="${step.attachmentUrl}" target="_blank" class="meta-pill" style="color:var(--accent-blue); text-decoration:none;">📎 PDF/Image Document</a>` : ''}
            ${step.notes ? `<div style="width:100%; font-size:11px; color:var(--text-muted); margin-top:4px;">📝 ${step.notes}</div>` : ''}
          </div>
        </div>
      `;
    }

    // Forward Status Cycle: Not Started ➔ In Progress ➔ In Hold ➔ Completed
    async function cycleStepStatusForward(stepId) {
      const forwardSequence = ['Not Started', 'In Progress', 'In Hold', 'Completed'];
      let targetStep = null;

      jobCards.forEach(j => j.steps.forEach(s => {
        if (s.id === stepId) {
          const currentIndex = forwardSequence.indexOf(s.status);
          const nextIndex = (currentIndex + 1) % forwardSequence.length;
          s.status = forwardSequence[nextIndex];
          targetStep = s;
        }
      }));

      renderAll();

      if (targetStep) {
        const initData = tg?.initData || '';
        const userId = tg?.initDataUnsafe?.user?.id || '8822239844';
        try {
          await fetch(`${WORKER_API_URL}/api/steps`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'X-Telegram-Init-Data': initData,
              'X-Telegram-User-Id': String(userId)
            },
            body: JSON.stringify({ stepId: targetStep.id, status: targetStep.status })
          });
        } catch (e) { console.error("Patch status error:", e); }
      }
    }

          await fetch(`${WORKER_API_URL}/api/steps`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData, 'X-Telegram-User-Id': String(userId) },
            body: JSON.stringify({ stepId: targetStep.id, category: activeTargetCategoryId })
          });
        } catch (e) {}
      }
    }

    function openAddCustomRuleModal() {
      const name = prompt("Enter Custom Category Name (e.g. 🔥 Heat Treatment Queue):");
      if (name) {
        customOthersCategories.push({ id: `cat-${Date.now()}`, emoji: '📌', title: name });
        renderOthersContent();
      }
    }

    function openAddFolderModal() {
      editingFolderId = null;
      document.getElementById('modal-folder-title-header').innerText = 'New Folder';
      document.getElementById('input-folder-name').value = '';
      document.getElementById('modal-folder').classList.add('active');
    }

    async function saveFolder(e) {
      e.preventDefault();
      const name = document.getElementById('input-folder-name').value;
      const initData = tg?.initData || '';
      const userId = tg?.initDataUnsafe?.user?.id || '8822239844';

      try {
        const res = await fetch(`${WORKER_API_URL}/api/folders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData, 'X-Telegram-User-Id': String(userId) },
          body: JSON.stringify({ folderId: editingFolderId, name, parentId: currentFolderId })
        });
        if (res.ok) {
          document.getElementById('input-folder-name').value = '';
          editingFolderId = null;
          closeModal('modal-folder');
          await fetchLiveData();
        } else {
          const errText = await res.text();
          alert(`Folder Save Error (${res.status}):\n${errText}`);
        }
      } catch (err) { alert(`Network error: ${err.message}`); }
    }

    function openAddJobCardModal() {
      editingJobId = null;
      document.getElementById('modal-job-title-header').innerText = 'New Job Card & Process Chart';
      document.getElementById('input-job-title').value = '';

      const select = document.getElementById('select-job-folder');
      select.innerHTML = '';
      folders.forEach(f => select.innerHTML += `<option value="${f.id}" ${f.id === currentFolderId ? 'selected' : ''}>${f.name}</option>`);

      builderSteps = [];
      addRichStepInput();
      document.getElementById('modal-job-editor').classList.add('active');
    }

    function addRichStepInput() {
      builderSteps.push({
        id: '',
        title: '',
        assignee: 'UNASSIGNED',
        status: 'Not Started',
        date: '',
        time: '',
        attachmentUrl: '',
        linkedJob: '',
        notes: ''
      });
      renderStepsBuilder();
    }

    function removeBuilderStep(idx) {
      builderSteps.splice(idx, 1);
      renderStepsBuilder();
    }

    function renderStepsBuilder() {
      const list = document.getElementById('steps-builder-list');
      list.innerHTML = builderSteps.map((s, idx) => `
        <div class="builder-step-card">
          <div style="display:flex; justify-style:space-between; align-items:center;">
            <strong style="font-size:12px; color:var(--accent-blue);">Operation Step #${idx + 1}</strong>
            <button type="button" style="background:rgba(242,139,130,0.15); color:var(--accent-red); border:1px solid var(--accent-red); padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;" onclick="removeBuilderStep(${idx})">Remove</button>
          </div>

          <input type="text" class="form-input" placeholder="Step Title (e.g. CNC Turning)" value="${s.title}" oninput="builderSteps[${idx}].title = this.value" required />

          <div style="display:flex; gap:8px;">
            <div style="flex:1;">
              <label class="form-label">Assignee</label>
              <select class="form-select" onchange="builderSteps[${idx}].assignee = this.value">
                <option value="UNASSIGNED" ${s.assignee==='UNASSIGNED'?'selected':''}>UNASSIGNED</option>
                <option value="JEEVAN" ${s.assignee==='JEEVAN'?'selected':''}>JEEVAN</option>
                <option value="RAVI KUMAR" ${s.assignee==='RAVI KUMAR'?'selected':''}>RAVI KUMAR</option>
                <option value="SANANTH" ${s.assignee==='SANANTH'?'selected':''}>SANANTH</option>
                <option value="ALL" ${s.assignee==='ALL'?'selected':''}>ALL</option>
              </select>
            </div>
            <div style="flex:1;">
              <label class="form-label">Initial Status</label>
              <select class="form-select" onchange="builderSteps[${idx}].status = this.value">
                <option value="Not Started" ${s.status==='Not Started'?'selected':''}>Not Started</option>
                <option value="In Progress" ${s.status==='In Progress'?'selected':''}>In Progress</option>
                <option value="In Hold" ${s.status==='In Hold'?'selected':''}>In Hold</option>
                <option value="Completed" ${s.status==='Completed'?'selected':''}>Completed</option>
              </select>
            </div>
          </div>

          <div style="display:flex; gap:8px;">
            <div style="flex:1;">
              <label class="form-label">Calendar / Deadline Date</label>
              <input type="date" class="form-input" value="${s.date}" onchange="builderSteps[${idx}].date = this.value" />
            </div>
            <div style="flex:1;">
              <label class="form-label">Time</label>
              <input type="time" class="form-input" value="${s.time}" onchange="builderSteps[${idx}].time = this.value" />
            </div>
          </div>

          <input type="text" class="form-input" placeholder="Manufacturing Specs / Notes" value="${s.notes}" oninput="builderSteps[${idx}].notes = this.value" />
        </div>
      `).join('');
    }

    async function saveJobCard(e) {
      e.preventDefault();
      const title = document.getElementById('input-job-title').value;
      const folderId = document.getElementById('select-job-folder').value;
      const initData = tg?.initData || '';
      const userId = tg?.initDataUnsafe?.user?.id || '8822239844';

      const payload = {
        jobId: editingJobId,
        title,
        folderId,
        steps: builderSteps
      };

      try {
        const res = await fetch(`${WORKER_API_URL}/api/jobcards`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData, 'X-Telegram-User-Id': String(userId) },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          document.getElementById('input-job-title').value = '';
          editingJobId = null;
          closeModal('modal-job-editor');
          await fetchLiveData();
        } else {
          const errText = await res.text();
          alert(`Job Card Save Error (${res.status}):\n${errText}`);
        }
      } catch (err) { alert(`Network error: ${err.message}`); }
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
