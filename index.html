<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TRACE MATRIX</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Mobile DevTools (Eruda) for live inspection inside Telegram -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>try { eruda.init(); } catch(e) {}</script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #131314;
      --card-bg: #1e1f20;
      --card-hover: #28292a;
      --border-subtle: #2d2e31;
      
      --accent-blue: #a8c7fa;
      --accent-blue-bg: rgba(168, 199, 250, 0.12);
      --accent-teal: #78d9ec;
      --accent-purple: #d0bcff;
      --accent-purple-bg: rgba(208, 188, 255, 0.12);
      --accent-amber: #fdd663;
      --accent-amber-bg: rgba(253, 214, 99, 0.12);
      --accent-green: #6dd58c;
      --accent-green-bg: rgba(109, 213, 140, 0.12);
      --accent-red: #f28b82;

      --text-primary: #e3e3e3;
      --text-muted: #8e918f;
      --font-main: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-main);
      min-height: 100vh;
      padding-top: 140px;
      padding-bottom: 90px;
    }

    /* Fixed Top Bars */
    .top-fixed-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--bg-dark);
      z-index: 900;
      border-bottom: 1px solid var(--border-subtle);
    }

    .diagnostic-bar {
      background: #1e1f20;
      padding: 4px 14px;
      font-family: var(--font-mono);
      font-size: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--accent-amber);
    }

    .search-row {
      padding: 8px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-primary { display: flex; border-top: 1px solid var(--border-subtle); }
    .primary-tab {
      flex: 1;
      padding: 10px 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
    }
    .primary-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }

    .sub-filter-bar { background: #171819; border-top: 1px solid var(--border-subtle); }
    .sub-row { display: flex; gap: 6px; padding: 8px 14px; overflow-x: auto; scrollbar-width: none; }
    .sub-row::-webkit-scrollbar { display: none; }

    .chip-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--bg-dark);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
    }
    .chip-btn.active { background: var(--accent-blue-bg); color: var(--accent-blue); border-color: var(--accent-blue); }

    .view-content { display: none; padding: 14px; max-width: 800px; margin: 0 auto; }
    .view-content.active { display: block; }

    .breadcrumbs {
      display: flex;
      gap: 6px;
      font-size: 12px;
      font-family: var(--font-mono);
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .job-header { display: flex; justify-content: space-between; align-items: center; }
    .item-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }

    .step-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .step-list.collapsed { display: none; }
    .step-card { background: var(--bg-dark); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 10px 12px; }

    .badge-status {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      font-family: var(--font-mono);
      cursor: pointer;
    }
    .status-notstarted { background: #2a2b2d; color: #a1a3a5; border: 1px solid #444; }
    .status-inprogress { background: var(--accent-purple-bg); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
    .status-inhold { background: var(--accent-amber-bg); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
    .status-completed { background: var(--accent-green-bg); color: var(--accent-green); border: 1px solid var(--accent-green); }

    .fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: #000;
      border: none;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      z-index: 700;
      box-shadow: 0 4px 20px rgba(168, 199, 250, 0.4);
    }

    /* Modal Sheet */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }

    .modal-drawer {
      background: var(--card-bg);
      border-top: 1px solid var(--border-subtle);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px 16px 36px 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    /* High Contrast Inputs */
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    select.form-select, input.form-input, textarea.form-textarea {
      width: 100%;
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 600 !important;
      border: 2px solid var(--accent-blue) !important;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
    }

    .btn-action {
      width: 100%;
      background: var(--accent-blue);
      color: #000000;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 10px; left: 10px; right: 10px;
      background: var(--accent-blue);
      color: #000;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      z-index: 999999;
      display: none;
    }
    .toast.active { display: block; }
  </style>
</head>
<body>

  <div class="toast" id="toast-banner"></div>

  <header class="top-fixed-wrapper">
    <div class="diagnostic-bar">
      <span id="diag-user">TG USER: DETECTING...</span>
      <span id="diag-status">STATUS: INITIALIZING</span>
    </div>

    <div class="search-row">
      <input
        type="text"
        id="global-search-input"
        class="form-input"
        style="margin-bottom:0; padding:10px 12px; font-size:13px;"
        placeholder="🔍 Search Specs, Ops, Jobs..."
        oninput="handleSearch(this.value)"
      />
      <button class="chip-btn" onclick="openFilterModal()">⚙️ Filters</button>
    </div>

    <nav class="nav-primary">
      <button class="primary-tab active" id="tab-btn-tree" onclick="switchTab('tree')">TREE</button>
      <button class="primary-tab" id="tab-btn-schedule" onclick="switchTab('schedule')">SCHEDULE</button>
      <button class="primary-tab" id="tab-btn-others" onclick="switchTab('others')">OTHERS</button>
    </nav>

    <div class="sub-filter-bar">
      <div class="sub-row" id="schedule-sub-nav" style="display:none;">
        <button class="chip-btn active" onclick="setScheduleSub('today', this)">TODAY</button>
        <button class="chip-btn" onclick="setScheduleSub('deadline', this)">DEADLINE</button>
        <button class="chip-btn" onclick="setScheduleSub('queue', this)">QUEUE</button>
      </div>

      <div class="sub-row" id="assignee-filter-bar">
        <button class="chip-btn active" onclick="setAssignee('ALL', this)">ALL</button>
        <button class="chip-btn" onclick="setAssignee('JEEVAN', this)">JEEVAN</button>
        <button class="chip-btn" onclick="setAssignee('RAVI KUMAR', this)">RAVI KUMAR</button>
        <button class="chip-btn" onclick="setAssignee('SANANTH', this)">SANANTH</button>
        <button class="chip-btn" onclick="setAssignee('UNASSIGNED', this)">UNASSIGNED</button>
      </div>
    </div>
  </header>

  <!-- TAB 1: TREE -->
  <main id="page-tree" class="view-content active">
    <div class="breadcrumbs" id="tree-breadcrumbs"></div>
    <div style="display:flex; gap:8px; margin-bottom:14px;">
      <button class="chip-btn" onclick="openFolderModal()">+ New Folder</button>
      <button class="chip-btn" onclick="openJobModal()">+ New Job Card</button>
    </div>
    <div id="tree-container"></div>
  </main>

  <!-- TAB 2: SCHEDULE -->
  <main id="page-schedule" class="view-content">
    <div id="schedule-container"></div>
  </main>

  <!-- TAB 3: OTHERS -->
  <main id="page-others" class="view-content">
    <button class="chip-btn" style="margin-bottom:14px;" onclick="openCategoryModal()">+ Add Category</button>
    <div id="others-container"></div>
  </main>

  <button class="fab" onclick="openJobModal()">+</button>

  <!-- JOB CARD BUILDER MODAL -->
  <div class="modal-overlay" id="modal-job">
    <div class="modal-drawer">
      <div class="modal-header">
        <h3 id="job-modal-title" style="font-size:16px;">Job Card Builder</h3>
        <button class="chip-btn" onclick="closeModal('modal-job')">✕</button>
      </div>
      <form onsubmit="saveJobCard(event)">
        <label class="form-label">Job Title</label>
        <input type="text" id="job-title-input" class="form-input" required placeholder="e.g. Worm Gear Batch" />

        <label class="form-label">Target Folder</label>
        <select id="job-folder-select" class="form-select"></select>

        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <label class="form-label" style="margin:0;">Operations</label>
          <button type="button" class="chip-btn" onclick="addBuilderStep()">+ Add Operation</button>
        </div>
        <div id="builder-steps-container"></div>

        <button type="submit" class="btn-action" style="margin-top:12px;">Save Job Card</button>
      </form>
    </div>
  </div>

  <!-- FOLDER MODAL -->
  <div class="modal-overlay" id="modal-folder">
    <div class="modal-drawer">
      <div class="modal-header">
        <h3 style="font-size:16px;">New Folder</h3>
        <button class="chip-btn" onclick="closeModal('modal-folder')">✕</button>
      </div>
      <form onsubmit="saveFolder(event)">
        <label class="form-label">Folder Name</label>
        <input type="text" id="folder-name-input" class="form-input" required placeholder="e.g., TURNING DEPT" />
        <button type="submit" class="btn-action">Create Folder</button>
      </form>
    </div>
  </div>

  <!-- CATEGORY MODAL -->
  <div class="modal-overlay" id="modal-category">
    <div class="modal-drawer">
      <div class="modal-header">
        <h3 style="font-size:16px;">New Category</h3>
        <button class="chip-btn" onclick="closeModal('modal-category')">✕</button>
      </div>
      <form onsubmit="saveCategory(event)">
        <label class="form-label">Category Name</label>
        <input type="text" id="category-name-input" class="form-input" required placeholder="e.g., ⚡ Calibration" />
        <button type="submit" class="btn-action">Create Category</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://project1-brain.aeijeevan.workers.dev";
    const tg = window.Telegram?.WebApp;

    // Default fallback state (ensures buttons work immediately even if offline/403)
    const state = {
      tab: 'tree',
      scheduleSub: 'today',
      assignee: 'ALL',
      search: '',
      currentFolder: 'root',
      folders: [
        { id: 'root', name: 'Root', parentId: null },
        { id: 'fld-1', name: 'CNC Workshop', parentId: 'root' }
      ],
      jobs: [
        {
          id: 'job-1',
          title: 'Worm Gear Batch #1',
          folderId: 'fld-1',
          isArchived: false,
          steps: [
            { id: 's-1', title: 'Rough Turning', assignee: 'JEEVAN', status: 'In Progress', date: '2026-10-20' },
            { id: 's-2', title: 'Gear Hobbing', assignee: 'SANANTH', status: 'Not Started', date: '2026-10-21' }
          ]
        }
      ],
      categories: [{ id: 'cat-1', name: '🚨 Overdue' }],
      builderSteps: []
    };

    // Global Error Catcher (Displays directly in banner)
    window.onerror = function(msg, url, line) {
      showToast(`Error L${line}: ${msg}`, true);
    };

    // Safe Telegram init
    let userId = "8822239844"; // Fallback Ravi Kumar
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.initDataUnsafe?.user?.id) {
          userId = String(tg.initDataUnsafe.user.id);
        }
      }
    } catch(e) {}

    document.getElementById('diag-user').innerText = `TG USER: ${userId}`;

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast-banner');
      t.innerText = msg;
      t.style.background = isError ? 'var(--accent-red)' : 'var(--accent-blue)';
      t.style.color = isError ? '#fff' : '#000';
      t.classList.add('active');
      setTimeout(() => t.classList.remove('active'), 4000);
    }

    // Direct render on startup
    renderAll();
    fetchLive();

    async function fetchLive() {
      const diagStatus = document.getElementById('diag-status');
      try {
        diagStatus.innerText = "STATUS: SYNCING...";
        const res = await fetch(`${API_URL}/api/data`, {
          headers: {
            'X-Telegram-User-Id': userId,
            'X-Telegram-Init-Data': tg?.initData || ''
          }
        });

        if (!res.ok) {
          const errText = await res.text();
          diagStatus.innerText = `HTTP ${res.status}: ${res.status === 403 ? 'USER NOT WHITELISTED' : 'SERVER ERR'}`;
          diagStatus.style.color = 'var(--accent-red)';
          showToast(`Backend Warning: ${res.status} ${errText}`, true);
          return;
        }

        const data = await res.json();
        if (data.folders) state.folders = [{ id: 'root', name: 'Root', parentId: null }, ...data.folders];
        if (data.jobCards) state.jobs = data.jobCards;

        diagStatus.innerText = "STATUS: ONLINE (SSOT)";
        diagStatus.style.color = 'var(--accent-green)';
        renderAll();
      } catch (err) {
        diagStatus.innerText = "STATUS: LOCAL FALLBACK";
        diagStatus.style.color = 'var(--accent-amber)';
      }
    }

    function switchTab(t) {
      state.tab = t;
      document.querySelectorAll('.primary-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));

      document.getElementById(`tab-btn-${t}`).classList.add('active');
      document.getElementById(`page-${t}`).classList.add('active');
      document.getElementById('schedule-sub-nav').style.display = t === 'schedule' ? 'flex' : 'none';
      renderAll();
    }

    function setScheduleSub(sub, el) {
      state.scheduleSub = sub;
      document.querySelectorAll('#schedule-sub-nav .chip-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderSchedule();
    }

    function setAssignee(assignee, el) {
      state.assignee = assignee;
      document.querySelectorAll('#assignee-filter-bar .chip-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderAll();
    }

    function handleSearch(val) {
      state.search = val.toLowerCase().trim();
      renderAll();
    }

    function renderAll() {
      renderTree();
      renderSchedule();
      renderOthers();
    }

    function renderTree() {
      const container = document.getElementById('tree-container');
      const breadcrumbs = document.getElementById('tree-breadcrumbs');
      container.innerHTML = '';
      
      const curFolder = state.folders.find(f => f.id === state.currentFolder) || { id: 'root', name: 'Root' };
      breadcrumbs.innerHTML = `<span onclick="state.currentFolder='root'; renderAll();" style="color:var(--accent-blue); cursor:pointer;">Root</span> ➔ <span style="color:#fff; font-weight:bold;">${curFolder.name}</span>`;

      let flds = state.folders.filter(f => f.parentId === state.currentFolder && f.id !== 'root');
      let jbs = state.jobs.filter(j => j.folderId === state.currentFolder && !j.isArchived);

      if (state.search) {
        flds = state.folders.filter(f => f.id !== 'root' && f.name.toLowerCase().includes(state.search));
        jbs = state.jobs.filter(j => !j.isArchived && j.title.toLowerCase().includes(state.search));
      }

      flds.forEach(f => {
        container.innerHTML += `
          <div class="card-item" onclick="state.currentFolder='${f.id}'; renderAll();">
            <div class="job-header">
              <span class="item-title">📁 ${f.name}</span>
              <span style="color:var(--text-muted);">➔</span>
            </div>
          </div>`;
      });

      jbs.forEach(j => {
        container.innerHTML += `
          <div class="card-item">
            <div class="job-header" onclick="toggleExpand('job-${j.id}')">
              <span class="item-title">⚙️ ${j.title}</span>
              <span id="arr-job-${j.id}" style="color:var(--accent-blue);">v</span>
            </div>
            <div class="step-list" id="steps-job-${j.id}">
              ${j.steps.map(s => renderStepHTML(s, j)).join('')}
            </div>
          </div>`;
      });

      if (flds.length === 0 && jbs.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:13px;">No folders or jobs found here.</div>`;
      }
    }

    function renderSchedule() {
      const c = document.getElementById('schedule-container');
      c.innerHTML = '';
      state.jobs.forEach(j => {
        j.steps.forEach(s => {
          if (state.assignee !== 'ALL' && s.assignee !== state.assignee) return;
          c.innerHTML += `<div class="card-item"><div style="font-size:10px; color:var(--accent-purple); font-weight:bold; margin-bottom:4px;">JOB: ${j.title}</div>${renderStepHTML(s, j)}</div>`;
        });
      });
    }

    function renderOthers() {
      const c = document.getElementById('others-container');
      c.innerHTML = state.categories.map(cat => `
        <div class="card-item">
          <div class="job-header">
            <span class="item-title">${cat.name}</span>
          </div>
        </div>`).join('');
    }

    function renderStepHTML(step, job) {
      const sc = `status-${step.status.toLowerCase().replace(/\s/g, '')}`;
      return `
        <div class="step-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:13px; font-weight:600;">${step.title}</span>
            <span class="badge-status ${sc}" onclick="cycleStep('${step.id}')">${step.status}</span>
          </div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">
            👤 ${step.assignee} ${step.date ? `| 📅 ${step.date}` : ''}
          </div>
        </div>`;
    }

    function toggleExpand(id) {
      const el = document.getElementById(`steps-${id}`);
      const arr = document.getElementById(`arr-${id}`);
      if (el.classList.contains('collapsed')) {
        el.classList.remove('collapsed');
        if (arr) arr.innerText = 'v';
      } else {
        el.classList.add('collapsed');
        if (arr) arr.innerText = '^';
      }
    }

    function cycleStep(stepId) {
      const seq = ['Not Started', 'In Progress', 'In Hold', 'Completed'];
      for (const j of state.jobs) {
        const s = j.steps.find(st => st.id === stepId);
        if (s) {
          s.status = seq[(seq.indexOf(s.status) + 1) % seq.length];
          renderAll();
          // Sync with worker in background
          fetch(`${API_URL}/api/steps`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
            body: JSON.stringify({ stepId: s.id, status: s.status })
          }).catch(()=>{});
          break;
        }
      }
    }

    // Modal Handlers (Pure standard display logic)
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function openFolderModal() {
      document.getElementById('folder-name-input').value = '';
      openModal('modal-folder');
    }

    function saveFolder(e) {
      e.preventDefault();
      const name = document.getElementById('folder-name-input').value.trim();
      if (!name) return;
      const newFolder = { id: `FLD-${Date.now()}`, name, parentId: state.currentFolder };
      state.folders.push(newFolder);
      closeModal('modal-folder');
      renderAll();
      showToast("Folder Created");

      fetch(`${API_URL}/api/folders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
        body: JSON.stringify(newFolder)
      }).catch(()=>{});
    }

    function openCategoryModal() {
      document.getElementById('category-name-input').value = '';
      openModal('modal-category');
    }

    function saveCategory(e) {
      e.preventDefault();
      const name = document.getElementById('category-name-input').value.trim();
      if (!name) return;
      state.categories.push({ id: `cat-${Date.now()}`, name });
      closeModal('modal-category');
      renderOthers();
      showToast("Category Added");
    }

    function openJobModal() {
      const fs = document.getElementById('job-folder-select');
      fs.innerHTML = state.folders.map(f => `<option value="${f.id}" ${f.id === state.currentFolder ? 'selected' : ''}>${f.name}</option>`).join('');
      state.builderSteps = [{ id: '', title: '', assignee: 'UNASSIGNED', status: 'Not Started', date: '' }];
      renderBuilderSteps();
      openModal('modal-job');
    }

    function addBuilderStep() {
      state.builderSteps.push({ id: '', title: '', assignee: 'UNASSIGNED', status: 'Not Started', date: '' });
      renderBuilderSteps();
    }

    function renderBuilderSteps() {
      const c = document.getElementById('builder-steps-container');
      c.innerHTML = state.builderSteps.map((s, idx) => `
        <div class="step-card" style="margin-bottom:8px;">
          <input type="text" class="form-input" placeholder="Operation Title" value="${s.title}" oninput="state.builderSteps[${idx}].title=this.value" required />
          <div style="display:flex; gap:6px;">
            <select class="form-select" onchange="state.builderSteps[${idx}].assignee=this.value">
              <option value="UNASSIGNED">UNASSIGNED</option>
              <option value="JEEVAN">JEEVAN</option>
              <option value="RAVI KUMAR">RAVI KUMAR</option>
              <option value="SANANTH">SANANTH</option>
            </select>
            <input type="date" class="form-input" value="${s.date}" onchange="state.builderSteps[${idx}].date=this.value" />
          </div>
        </div>`).join('');
    }

    function saveJobCard(e) {
      e.preventDefault();
      const title = document.getElementById('job-title-input').value.trim();
      const folderId = document.getElementById('job-folder-select').value;
      const newJob = {
        id: `JOB-${Date.now()}`,
        title,
        folderId,
        isArchived: false,
        steps: state.builderSteps.map((s, i) => ({
          ...s,
          id: `STP-${Date.now()}-${i}`
        }))
      };

      state.jobs.push(newJob);
      closeModal('modal-job');
      renderAll();
      showToast("Job Card Saved");

      fetch(`${API_URL}/api/jobcards`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': userId },
        body: JSON.stringify(newJob)
      }).catch(()=>{});
    }

    function openFilterModal() { showToast("Filters configured"); }
  </script>
</body>
</html>
